<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Monitoring Kegiatan SDM PKH Tapin </title>

  <!-- PENGAMAN 1: Mencegah layar blank akibat error sistem -->
  <script>
    window.onerror = function(msg, url, line) { 
      if(msg.includes("ResizeObserver")) return true;
      const loader = document.getElementById('native-loader');
      if(loader) loader.innerHTML = `<h3 style="color:red; font-family:sans-serif; text-align:center; margin-top:20px;">Gagal memuat. Silakan Refresh browser Anda.</h3>`;
      return false; 
    };
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: { DEFAULT: '#0B132B', light: '#1C2541', accent: '#3A506B' },
            status: { proses: '#10b981', selesai: '#3b82f6' }
          },
          boxShadow: {
            'glossy': '0 10px 25px -5px rgba(11, 19, 43, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1)',
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)'
          }
        }
      }
    }
  </script>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />

  <!-- FIREBASE REALTIME DATABASE COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- React & Excel Dependencies -->
  <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { background-color: #f4f6f9; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
    .card-btn { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; display: block; width: 100%; text-align: left; border: none; outline: none; }
    .card-btn:active { transform: scale(0.96); }
    input, select, button { outline: none; cursor: pointer; }
    
    /* Animasi Pre-Loader HTML Murni */
    .spinner { border: 4px solid rgba(11, 19, 43, 0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #0B132B; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="text-slate-800 pb-24">

  <!-- PENGAMAN 2: PRE-LOADER ANTI BLANK PUTIH -->
  <div id="native-loader" style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; width: 100%; position: absolute; z-index: 9999;">
    <div class="spinner"></div>
    <h2 style="font-family: sans-serif; font-weight: 900; color: #0B132B; margin: 0; font-size: 20px;">Memuat Sistem...</h2>
    <p style="font-family: sans-serif; color: #6c757d; font-size: 13px; margin-top: 5px; font-weight: bold;">MonitorSDMPKHTapin</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect, memo, Component } = React;

    // --- ERROR BOUNDARY REACT ---
    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorMsg: '' }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorMsg: error.toString() }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-red-50 text-center">
               <i className="fa-solid fa-triangle-exclamation text-red-500 text-6xl mb-4 drop-shadow-md"></i>
               <h2 className="text-2xl font-black text-red-700 mb-2">Aplikasi Terhenti</h2>
               <p className="text-xs font-bold text-red-600 mb-6 bg-white p-3 rounded-lg border border-red-200">{this.state.errorMsg}</p>
               <button onClick={() => window.location.reload()} className="bg-red-600 text-white font-bold py-3 px-6 rounded-full shadow-md">Muat Ulang Aplikasi</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // =========================================================================
    // 🔥 KONFIGURASI FIREBASE ANDA
    // =========================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBEc1KmTOURFvVkUsGXb1Q_sTwX0tm_z9E",
        authDomain: "monit-kegiatan.firebaseapp.com",
        databaseURL: "https://monit-kegiatan-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "monit-kegiatan",
        storageBucket: "monit-kegiatan.firebasestorage.app",
        messagingSenderId: "778332842690",
        appId: "1:778332842690:web:a723b5200fda1f3391e95b"
    };
    const APP_ID = 'monit-kegiatan';
    // =========================================================================

    const formatDateId = (dateString) => {
      if (!dateString) return "-";
      const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      const parts = dateString.split("-");
      if(parts.length !== 3) return dateString;
      return `${parts[2]} ${months[parseInt(parts[1])-1]} ${parts[0]}`;
    };

    // --- KOMPONEN: LIVE COUNTDOWN KAPSUL ---
    const LiveCountdown = memo(({ deadline }) => {
      const [timeLeft, setTimeLeft] = useState('');
      const [isExpired, setIsExpired] = useState(false);

      useEffect(() => {
        const targetDate = new Date(`${deadline}T23:59:59`).getTime();
        const updateTimer = () => {
          const now = new Date().getTime();
          const distance = targetDate - now;
          if (isNaN(distance)) { setTimeLeft("--:--"); setIsExpired(true); return; }
          if (distance < 0) { setTimeLeft("HABIS"); setIsExpired(true); return; }

          const d = Math.floor(distance / (1000 * 60 * 60 * 24));
          const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const s = Math.floor((distance % (1000 * 60)) / 1000);
          
          setTimeLeft(`${d > 0 ? d + 'H ' : ''}${h < 10 ? '0'+h : h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`);
          setIsExpired(d <= 2);
        };
        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [deadline]);

      return (
        <div className={`flex items-center gap-2 rounded-full px-3 py-1.5 shadow-sm border ${isExpired ? 'bg-red-600 border-red-500' : 'bg-midnight text-white border-midnight-accent'}`}>
          <i className={`fa-solid ${isExpired ? 'fa-triangle-exclamation fa-beat text-white' : 'fa-clock text-yellow-400'} text-[10px]`}></i>
          <div className="flex flex-col text-left">
            <span className="text-[8px] uppercase tracking-widest text-white/70 leading-none">Tenggat</span>
            <span className="font-mono font-bold text-[11px] text-white leading-none mt-1">{timeLeft}</span>
          </div>
        </div>
      );
    });

    // --- KOMPONEN: KARTU KEGIATAN ---
    const GroupedTaskCard = memo(({ group, onClick }) => {
      const percent = Math.min(Math.round((group.progress / group.target) * 100), 100);
      const isDone = percent >= 100;
      const borderColor = isDone ? 'border-status-selesai' : 'border-status-proses';
      const progressBg = isDone ? 'bg-status-selesai' : 'bg-status-proses';
      const percentColor = isDone ? 'text-status-selesai' : 'text-status-proses';
      
      return (
        <button type="button" className={`card-btn bg-white rounded-3xl shadow-soft border-l-[6px] ${borderColor} overflow-hidden`} onClick={() => onClick(group.taskName)}>
          <div className="p-5">
            <div className="flex justify-between items-start gap-3 mb-4">
              <div className="flex-1">
                <h5 className="font-black text-midnight text-lg leading-tight mb-2">{group.taskName}</h5>
                <span className="inline-flex items-center gap-1.5 bg-slate-50 border border-slate-200 text-slate-500 px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wide">
                  <i className="fa-regular fa-calendar-check"></i> {formatDateId(group.deadline)}
                </span>
              </div>
              <LiveCountdown deadline={group.deadline} />
            </div>

            <div className="mb-4">
              <div className="flex justify-between text-xs font-bold mb-1.5">
                <span className="text-slate-500">Progress ({group.progress}/{group.target})</span>
                <span className={`font-black text-sm ${percentColor}`}>{percent}%</span>
              </div>
              <div className="w-full bg-slate-100 rounded-full h-2.5 shadow-inner">
                <div className={`${progressBg} h-2.5 rounded-full transition-all duration-1000 ease-out`} style={{ width: `${percent}%` }}></div>
              </div>
            </div>
            
            <div className="flex justify-between items-center pt-4 border-t border-slate-100/80">
              <div className="text-xs font-bold text-slate-500 flex items-center gap-1.5">
                <i className="fa-solid fa-users text-slate-400"></i> {group.assignees.length} Pelaksana
              </div>
              <div className="text-xs font-black text-white bg-midnight px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5">
                <i className="fa-solid fa-check-double text-blue-400"></i> Selesai: {group.assignees.filter(a => a.progress >= a.target).length}
              </div>
            </div>
          </div>
        </button>
      );
    });

    // --- MENU 1: DASHBOARD ---
    const Dashboard = ({ groupedTasks, votings, setActiveTab, setSelectedTaskName, setSelectedVoteId }) => {
      const totalTasks = groupedTasks.length;
      const completedTasks = groupedTasks.filter(g => g.status === 'Selesai').length;
      const activeGroups = groupedTasks.filter(g => g.status === 'On Progress');
      
      return (
        <div className="animate-slide-up space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="text-2xl font-black text-midnight tracking-tight">Beranda</h3>
              <p className="text-slate-500 text-sm font-bold mt-0.5">Ringkasan Evaluasi Kinerja</p>
            </div>
            <span className="bg-white border border-slate-200 text-midnight font-bold px-3 py-1.5 rounded-full shadow-sm text-xs flex items-center gap-1.5">
              <i className="fa-solid fa-wifi fa-fade text-status-selesai"></i> Online
            </span>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-gradient-to-br from-midnight to-midnight-light rounded-3xl shadow-glossy p-5 text-white relative overflow-hidden flex items-center justify-between">
              <i className="fa-solid fa-chart-column absolute -right-4 -bottom-4 text-7xl opacity-20"></i>
              <div className="relative z-10">
                <h6 className="text-[10px] text-white/70 uppercase tracking-widest font-bold mb-1">Semua Kegiatan</h6>
                <h2 className="text-4xl font-black">{totalTasks}</h2>
              </div>
              <div className="bg-white/10 p-3 rounded-2xl backdrop-blur-sm relative z-10 border border-white/10">
                <i className="fa-solid fa-list-check text-xl"></i>
              </div>
            </div>
            
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-5 flex flex-col justify-center items-center text-center">
              <div className="bg-status-selesai/10 text-status-selesai w-12 h-12 rounded-full flex items-center justify-center mb-3">
                <i className="fa-solid fa-check-circle text-2xl"></i>
              </div>
              <h2 className="text-3xl font-black text-midnight mb-1">{completedTasks}</h2>
              <h6 className="text-xs text-slate-500 font-bold uppercase tracking-wider">Telah Selesai</h6>
            </div>
            
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-5 flex flex-col justify-center items-center text-center">
              <div className="bg-status-proses/10 text-status-proses w-12 h-12 rounded-full flex items-center justify-center mb-3">
                <i className="fa-solid fa-person-digging text-2xl"></i>
              </div>
              <h2 className="text-3xl font-black text-midnight mb-1">{totalTasks - completedTasks}</h2>
              <h6 className="text-xs text-slate-500 font-bold uppercase tracking-wider">Sedang Proses</h6>
            </div>
          </div>

          {/* VOTING AKTIF DI DASHBOARD */}
          {votings && votings.length > 0 && (
            <div className="mt-8 animate-slide-up">
              <h5 className="font-bold text-midnight mb-4 flex items-center gap-2">
                <i className="fa-solid fa-check-to-slot text-blue-500 text-lg"></i>  Voting
              </h5>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {votings.map(v => {
                  const totalVoters = v.voters ? v.voters.length : 0;
                  const totalVotes = v.votes ? Object.keys(v.votes).length : 0;
                  return (
                    <button key={v.id} onClick={() => { setSelectedVoteId(v.id); setActiveTab('voting'); }} className="card-btn bg-white rounded-3xl shadow-soft border border-slate-100 p-5 relative overflow-hidden">
                      <div className="flex items-start justify-between mb-3">
                        <h5 className="font-black text-midnight text-lg w-3/4 leading-tight">{v.title}</h5>
                        <span className="bg-blue-50 text-status-selesai text-[10px] font-black px-2 py-1 rounded-md border border-blue-100 uppercase">{v.isMulti ? 'Multi' : 'Single'}</span>
                      </div>
                      <div className="text-[10px] font-bold text-slate-500 mb-3 bg-slate-50 border border-slate-100 px-2 py-1 rounded-md w-max"><i className="fa-solid fa-calendar-day mr-1"></i> {formatDateId(v.createdAt)}</div>
                      <div className="w-full bg-slate-100 rounded-full h-1.5 mb-2"><div className="bg-status-selesai h-1.5 rounded-full" style={{width: `${totalVoters===0?0:(totalVotes/totalVoters)*100}%`}}></div></div>
                      <div className="text-[10px] font-black text-slate-400 flex justify-between"><span>SUARA MASUK</span> <span className="text-midnight">{totalVotes} / {totalVoters} Org</span></div>
                    </button>
                  )
                })}
              </div>
            </div>
          )}

          <div className="mt-8">
            <h5 className="font-bold text-midnight mb-4 flex items-center gap-2">
              <i className="fa-solid fa-fire-flame-curved text-red-500 text-lg"></i> Mendesak (Tenggat Terdekat)
            </h5>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {activeGroups.sort((a, b) => new Date(a.deadline) - new Date(b.deadline)).slice(0, 4).map(group => (
                <GroupedTaskCard key={group.taskName} group={group} onClick={(name) => { setSelectedTaskName(name); setActiveTab('kegiatan'); }} />
              ))}
              {activeGroups.length === 0 && (
                <div className="col-span-full bg-white rounded-3xl shadow-soft border border-slate-100 text-center py-10">
                  <i className="fa-solid fa-mug-hot d-block text-5xl mb-4 text-slate-300"></i> 
                  <h5 className="font-black text-midnight text-lg mb-1">Pekerjaan Tuntas!</h5>
                  <p className="text-slate-500 text-sm font-medium">Tidak ada kegiatan yang berjalan saat ini.</p>
                </div>
              )}
            </div>
          </div>
          
          <div className="text-center text-[10px] text-slate-400 mt-10 mb-4 font-bold uppercase tracking-widest opacity-60">
            Developed by M. Zaen Syachrullah
          </div>
        </div>
      );
    };

    // --- MENU 2: KEGIATAN & EVALUASI DETAIL ---
    const DaftarKegiatan = ({ groupedTasks, selectedTaskName, setSelectedTaskName, isAdminLogged }) => {
      const [toast, setToast] = useState(null);
      const activeGroup = groupedTasks.find(g => g.taskName === selectedTaskName);

      const showToast = (type) => {
        setToast(type);
        setTimeout(() => setToast(null), 3000);
      };

      const handleExportExcel = () => {
        if(!activeGroup) return;
        try {
          const exportData = activeGroup.assignees.map((a, i) => ({
            "No": i + 1,
            "Nama Kegiatan": a.taskName,
            "Nama Pegawai": a.picId,
            "Mulai Mengerjakan": a.startDate ? a.startDate : "-",
            "Jumlah Target": a.target,
            "Capaian Progres": a.progress,
            "Belum Selesai (Sisa)": Math.max(0, a.target - a.progress),
            "Status": a.status,
            "Tanggal Selesai": a.status === 'Selesai' && a.completedAt ? a.completedAt : "Belum Selesai"
          }));
          const ws = window.XLSX.utils.json_to_sheet(exportData);
          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, ws, "Evaluasi Data");
          window.XLSX.writeFile(wb, `Evaluasi_${activeGroup.taskName.replace(/\s+/g, '_')}.xlsx`);
          showToast('success');
        } catch (err) { showToast('error'); }
      };

      // FUNGSI SHARE LIVE LINK DENGAN DOUBLE FALLBACK AGAR PASTI BERHASIL
      const handleShareLivePreview = () => {
        const url = `${window.location.origin}${window.location.pathname}?preview=${encodeURIComponent(activeGroup.taskName)}`;
        
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(() => {
            showToast('success');
            alert('Berhasil! Link Live Preview telah disalin.\n\nSilakan Paste di WhatsApp:\n' + url);
          }).catch(() => {
            window.prompt("Salin link Live Preview berikut manual:", url);
          });
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = url;
          textArea.style.position = "fixed";
          textArea.style.left = "-999999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try {
            document.execCommand('copy');
            showToast('success');
            alert('Berhasil! Link Live Preview telah disalin.\n\nSilakan Paste di WhatsApp:\n' + url);
          } catch (err) {
            window.prompt("Salin link Live Preview berikut manual:", url);
          }
          document.body.removeChild(textArea);
        }
      };

      if (activeGroup) {
        const totalPelaksana = activeGroup.assignees.length;
        const selesaiCount = activeGroup.assignees.filter(a => a.progress >= a.target).length;
        const belumCount = totalPelaksana - selesaiCount;
        const today = new Date().toISOString().split('T')[0];

        return (
          <div className="animate-slide-up space-y-5">
            
            {/* COMPACT TOAST NOTIFICATION */}
            {toast && (
              <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[9999] animate-slide-up">
                <div className={`px-5 py-2 rounded-full shadow-lg font-black text-xs flex items-center gap-2 text-white ${toast === 'success' ? 'bg-status-selesai' : 'bg-red-500'}`}>
                  <i className={`fa-solid ${toast === 'success' ? 'fa-check-circle' : 'fa-xmark-circle'} text-lg`}></i> 
                  {toast === 'success' ? 'BERHASIL' : 'GAGAL'}
                </div>
              </div>
            )}

            <div className="flex flex-wrap gap-2 justify-between items-center mb-2">
              <button onClick={() => setSelectedTaskName(null)} className="bg-white text-midnight border border-slate-200 shadow-sm rounded-full font-bold px-4 py-2 text-xs flex items-center gap-2 hover:bg-slate-50 transition-colors outline-none">
                <i className="fa-solid fa-arrow-left-long text-status-selesai"></i> Kembali
              </button>
              
              {/* TOMBOL RAHASIA ADMIN */}
              {isAdminLogged && (
                <div className="flex gap-2">
                  <button onClick={handleShareLivePreview} className="bg-gradient-to-r from-emerald-500 to-emerald-600 text-white shadow-md rounded-full font-black px-3 py-2 text-[10px] sm:text-xs flex items-center gap-1.5 hover:scale-95 transition-transform outline-none">
                    <i className="fa-solid fa-share-nodes"></i> Share Live
                  </button>
                  <button onClick={handleExportExcel} className="bg-gradient-to-r from-yellow-400 to-yellow-600 text-white shadow-md rounded-full font-black px-3 py-2 text-[10px] sm:text-xs flex items-center gap-1.5 hover:scale-95 transition-transform outline-none">
                    <i className="fa-solid fa-file-export"></i> Excel
                  </button>
                </div>
              )}
            </div>
            
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 overflow-hidden">
              <div className="bg-gradient-to-r from-midnight to-midnight-light p-6 text-white relative">
                <div className="absolute top-0 right-0 p-4 opacity-10"><i className="fa-solid fa-chart-column text-8xl"></i></div>
                <span className={`inline-flex items-center gap-1.5 ${activeGroup.status === 'Selesai' ? 'bg-status-selesai' : 'bg-white text-status-proses'} text-xs font-black px-3 py-1.5 rounded-lg mb-4 shadow-sm uppercase tracking-wider`}>
                  <i className={`fa-solid ${activeGroup.status === 'Selesai' ? 'fa-check-double text-white' : 'fa-spinner fa-spin'}`}></i> {activeGroup.status}
                </span>
                <h3 className="text-2xl font-black mb-2 relative z-10 leading-tight">{activeGroup.taskName}</h3>
                <p className="text-white/80 font-bold text-sm m-0 flex items-center gap-2 relative z-10">
                  <i className="fa-solid fa-calendar-day text-blue-300"></i> Tenggat: {formatDateId(activeGroup.deadline)}
                </p>
              </div>
              
              <div className="p-6">
                <div className="grid grid-cols-3 gap-3 mb-6">
                  <div className="bg-slate-50 rounded-2xl border border-slate-100 p-3 text-center flex flex-col justify-center shadow-sm">
                    <h2 className="text-2xl font-black text-midnight mb-0.5">{totalPelaksana}</h2>
                    <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Pelaksana</span>
                  </div>
                  <div className="bg-status-selesai/10 rounded-2xl border border-status-selesai/20 p-3 text-center flex flex-col justify-center shadow-sm">
                    <h2 className="text-2xl font-black text-status-selesai mb-0.5">{selesaiCount}</h2>
                    <span className="text-[10px] text-status-selesai font-bold uppercase tracking-wider">Selesai</span>
                  </div>
                  <div className="bg-status-proses/10 rounded-2xl border border-status-proses/20 p-3 text-center flex flex-col justify-center shadow-sm">
                    <h2 className="text-2xl font-black text-status-proses mb-0.5">{belumCount}</h2>
                    <span className="text-[10px] text-status-proses font-bold uppercase tracking-wider">Proses</span>
                  </div>
                </div>

                <h6 className="font-black text-midnight mb-4 flex items-center gap-2 text-sm uppercase tracking-wider border-b border-slate-100 pb-3">

    // --- MENU KHUSUS: LIVE PREVIEW PUBLIK ---

                        <div className="flex flex-col gap-1">
                          <span className="text-white/50">Capaian: <span className="text-white">{a.progress}</span> / {a.target}</span>

              Live Preview • MonitorSDMPKHTapin

    // --- MENU 3: LEADERBOARD (RANK PER KEGIATAN SPESIFIK) ---
    const Leaderboard = ({ groupedTasks }) => {
      const [selectedRankTask, setSelectedRankTask] = useState(null);

      if (selectedRankTask) {
        const activeGroup = groupedTasks.find(g => g.taskName === selectedRankTask);
        if (!activeGroup) {
          setSelectedRankTask(null);
          return null;
        }

        const stats = activeGroup.assignees.map(a => {
           const percent = a.target === 0 ? 0 : Math.min(Math.round((a.progress / a.target) * 100), 100);
           return { ...a, percent };
        }).sort((a, b) => b.percent - a.percent);

        return (
          <div className="animate-slide-up space-y-6 pb-10">
            <div className="flex flex-col gap-2">
              <button onClick={() => setSelectedRankTask(null)} className="w-max bg-white text-midnight border border-slate-200 shadow-sm rounded-full font-bold px-4 py-2 text-xs flex items-center gap-2 hover:bg-slate-50 outline-none cursor-pointer">
                <i className="fa-solid fa-arrow-left-long text-status-selesai"></i> Kembali
              </button>
              <div>
                <h3 className="text-2xl font-black text-midnight tracking-tight">Leaderboard Spesifik</h3>

                    <tr className="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-wider font-bold border-b border-slate-200">

                    {stats.length === 0 && <tr><td colSpan="4" className="text-center py-10 text-slate-400 font-bold">Belum ada data pegawai</td></tr>}

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {groupedTasks.length === 0 && (

                <i className="fa-solid fa-box-open d-block text-5xl mb-4 text-slate-300"></i>
                <p className="font-black text-slate-500">Belum ada kegiatan terdaftar.</p>
              </div>
            )}
            {groupedTasks.map(group => <GroupedTaskCard key={group.taskName} group={group} onClick={setSelectedRankTask} />)}
          </div>
        </div>

    };

    // --- MENU 4: INPUT PROGRES (Hanya Icon Notifikasi + Daily Progress) ---
    const ProgressForm = ({ tasks, employees, db }) => {
      const [selectedEmp, setSelectedEmp] = useState('');
      const [selectedTask, setSelectedTask] = useState('');
      const [amount, setAmount] = useState('');
      const [toast, setToast] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);

      const availableTasks = tasks.filter(t => String(t.picId) === String(selectedEmp) && t.status === 'On Progress');

      const showToast = (type) => {
        setToast(type);
        setTimeout(() => setToast(null), 3000);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!selectedEmp || !selectedTask || !amount || parseInt(amount) <= 0) {
          showToast('error'); return;
        }
        if (!db) { showToast('error'); return; }
        
        setIsSyncing(true);
        try {
          const task = tasks.find(t => String(t.id) === String(selectedTask));
          if(!task) { showToast('error'); setIsSyncing(false); return; }

          const amountInt = parseInt(amount);
          const newProgress = Math.min(task.progress + amountInt, task.target);
          const isDone = newProgress >= task.target;
          const today = new Date().toISOString().split('T')[0];

          // Hitung progres khusus hari ini
          const currentDaily = (task.daily && task.daily[today]) ? parseInt(task.daily[today]) : 0;
          
          const updates = { 
            progress: newProgress, 
            status: isDone ? 'Selesai' : 'On Progress'
          };
          updates[`daily/${today}`] = currentDaily + amountInt;
          
          if (isDone && task.status !== 'Selesai') updates.completedAt = today;
          else if (!isDone) updates.completedAt = null;
          else updates.completedAt = task.completedAt || null;

          await db.ref(`artifacts/${APP_ID}/public/data/tasks/${task.id}`).update(updates);

          setAmount('');
          showToast('success');
        } catch (err) { showToast('error'); }
        setIsSyncing(false);
      };

      return (
        <div className="animate-slide-up max-w-lg mx-auto space-y-6 relative">
          
          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[9999] animate-slide-up">
              <div className={`px-5 py-2 rounded-full shadow-lg font-black text-xs flex items-center gap-2 text-white ${toast === 'success' ? 'bg-status-selesai' : 'bg-red-500'}`}>
                <i className={`fa-solid ${toast === 'success' ? 'fa-check-circle' : 'fa-xmark-circle'} text-lg`}></i> 
                {toast === 'success' ? 'BERHASIL' : 'GAGAL'}
              </div>
            </div>
          )}

          <div className="text-center mt-4">
            <div className="bg-gradient-to-br from-midnight to-midnight-light text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-glossy">
               <i className="fa-solid fa-pen-to-square text-3xl"></i>
            </div>
            <h3 className="text-2xl font-black text-midnight tracking-tight">Lapor Progres</h3>
            <p className="text-slate-500 text-sm font-bold mt-1">Kirim hasil pekerjaan harian Anda.</p>
          </div>
          
          <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-6 md:p-8">
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-xs font-black text-midnight mb-2 uppercase tracking-wider"><i className="fa-solid fa-user-tag text-slate-400 mr-2"></i>Pilih Identitas</label>
                <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-bold text-midnight outline-none cursor-pointer" value={selectedEmp} onChange={(e) => { setSelectedEmp(e.target.value); setSelectedTask(''); }}>
                  <option value="">-- Ketuk untuk memilih --</option>
                  {employees.map(emp => <option key={emp.id} value={emp.name}>{emp.name}</option>)}
                </select>
              </div>
              
              {selectedEmp && (
                <div className="animate-slide-up">
                  <label className="block text-xs font-black text-midnight mb-2 uppercase tracking-wider"><i className="fa-solid fa-list-check text-slate-400 mr-2"></i>Pilih Pekerjaan Aktif</label>
                  <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-bold text-midnight outline-none cursor-pointer" value={selectedTask} onChange={(e) => setSelectedTask(e.target.value)}>
                    <option value="">-- Pilih Pekerjaan --</option>
                    {availableTasks.map(t => <option key={t.id} value={t.id}>{t.taskName} (Sisa target: {t.target - t.progress})</option>)}
                  </select>
                </div>
              )}
              
              {selectedTask && (
                <div className="animate-slide-up">
                  <label className="block text-xs font-black text-midnight mb-2 uppercase tracking-wider"><i className="fa-solid fa-arrow-up-9-1 text-slate-400 mr-2"></i>Jumlah Diselesaikan Hari Ini</label>
                  <input type="number" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 text-3xl text-center font-black text-status-selesai outline-none placeholder:text-slate-300" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" />
                </div>
              )}
              
              <button type="submit" disabled={isSyncing} className="w-full bg-gradient-to-r from-midnight to-midnight-light text-white font-bold py-4 rounded-xl shadow-glossy hover:opacity-90 active:scale-95 transition-all flex justify-center items-center gap-2 mt-2 outline-none cursor-pointer">
                {isSyncing ? <><i className="fa-solid fa-circle-notch fa-spin text-white"></i> Memproses...</> : <><i className="fa-solid fa-paper-plane text-status-selesai"></i> Kirim Laporan</>}
              </button>
            </form>
          </div>
        </div>
      );
    };

    // --- MENU 5: VOTING PEMILIHAN ---
    const MenuVoting = ({ votings, db, employees, isAdminLogged, selectedVoteId, setSelectedVoteId }) => {
      const [activeTab, setActiveTab] = useState('statistik'); 
      const [voteEmp, setVoteEmp] = useState('');
      const [selectedOptions, setSelectedOptions] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);
      const [toast, setToast] = useState(null);

      const activeVote = votings.find(v => String(v.id) === String(selectedVoteId));

      const showToast = (type) => {
        setToast(type);
        setTimeout(() => setToast(null), 3000);
      };

      const handleCastVote = async (e) => {
        e.preventDefault();
        if(!db || !voteEmp || selectedOptions.length === 0) { showToast('error'); return; }
        setIsSyncing(true);
        try {
           const safeKey = btoa(unescape(encodeURIComponent(voteEmp))).replace(/[.#$/\[\]]/g, '_');
           await db.ref(`artifacts/${APP_ID}/public/data/votings/${activeVote.id}/votes/${safeKey}`).set({
             name: voteEmp,
             options: selectedOptions
           });
           showToast('success');
           setVoteEmp(''); setSelectedOptions([]); setActiveTab('statistik');
        } catch (err) { showToast('error'); }
        setIsSyncing(false);
      };

      const toggleOption = (opt) => {
        if (!activeVote.isMulti) { setSelectedOptions([opt]); return; }
        if (selectedOptions.includes(opt)) setSelectedOptions(selectedOptions.filter(o => o !== opt));
        else setSelectedOptions([...selectedOptions, opt]);
      };

      if (!selectedVoteId) {
        return (
          <div className="animate-slide-up space-y-6">
            <div className="flex justify-between items-center">
              <div>
                <h3 className="text-2xl font-black text-midnight tracking-tight">Kotak Suara</h3>
                <p className="text-slate-500 text-sm font-bold mt-0.5">Pemilihan & Voting Bersama</p>
              </div>
            </div>

            <div className="grid grid-cols-1 gap-4">
              {votings.length === 0 && (
                <div className="bg-white rounded-3xl shadow-soft border border-slate-100 text-center py-12">
                  <i className="fa-solid fa-check-to-slot d-block text-5xl mb-4 text-slate-300"></i>
                  <p className="font-black text-slate-500">Belum ada  voting aktif.</p>
                </div>
              )}
              {votings.map(v => {
                const totalVoters = v.voters ? v.voters.length : 0;
                const totalVotes = v.votes ? Object.keys(v.votes).length : 0;
                return (
                  <button type="button" key={v.id} onClick={() => setSelectedVoteId(v.id)} className="card-btn bg-white rounded-3xl shadow-soft border border-slate-100 p-5 relative overflow-hidden">
                    <div className="flex items-start justify-between mb-3">
                      <h5 className="font-black text-midnight text-lg w-3/4">{v.title}</h5>
                      <span className="bg-blue-50 text-status-selesai text-[10px] font-black px-2 py-1 rounded-md border border-blue-100 uppercase">{v.isMulti ? 'Multi' : 'Single'}</span>
                    </div>
                    <div className="text-[10px] font-bold text-slate-500 mb-3 bg-slate-50 border border-slate-100 px-2 py-1 w-max rounded-md"><i className="fa-solid fa-calendar-day mr-1"></i> {formatDateId(v.createdAt)}</div>
                    <div className="w-full bg-slate-100 rounded-full h-1.5 mb-1.5"><div className="bg-status-selesai h-1.5 rounded-full" style={{width: `${totalVoters===0?0:(totalVotes/totalVoters)*100}%`}}></div></div>
                    <div className="text-[10px] font-black text-slate-400 flex justify-between"><span>SUARA MASUK</span> <span className="text-midnight">{totalVotes} / {totalVoters} Org</span></div>
                  </button>
                )
              })}
            </div>
          </div>
        );
      }

      const votesObj = activeVote.votes || {};
      const votesArray = Object.values(votesObj);
      const sudahVoteNames = votesArray.map(v => v.name).sort((a,b) => a.localeCompare(b));
      const voters = activeVote.voters || [];
      const belumVoteNames = voters.filter(v => !sudahVoteNames.includes(v)).sort((a,b) => a.localeCompare(b));

      const optionCounts = {};
      activeVote.options.forEach(o => optionCounts[o] = 0);
      let totalSuaraMasuk = 0;
      votesArray.forEach(vote => {
         if(vote.options && Array.isArray(vote.options)) {
           vote.options.forEach(p => { if(optionCounts[p] !== undefined) optionCounts[p]++; totalSuaraMasuk++; });
         }
      });

      return (
        <div className="animate-slide-up space-y-4 relative pb-10">
          {toast && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[9999] animate-slide-up">
              <div className={`px-5 py-2 rounded-full shadow-lg font-black text-xs flex items-center gap-2 text-white ${toast === 'success' ? 'bg-status-selesai' : 'bg-red-500'}`}>
                <i className={`fa-solid ${toast === 'success' ? 'fa-check-circle' : 'fa-xmark-circle'} text-lg`}></i> 
                {toast === 'success' ? 'BERHASIL' : 'GAGAL'}
              </div>
            </div>
          )}

          <button type="button" onClick={() => setSelectedVoteId(null)} className="bg-white text-midnight border border-slate-200 shadow-sm rounded-full font-bold px-4 py-2 text-xs flex items-center gap-2 hover:bg-slate-50 outline-none cursor-pointer">
            <i className="fa-solid fa-arrow-left-long text-status-selesai"></i> Kembali
          </button>

          <div className="bg-gradient-to-br from-midnight to-midnight-light rounded-3xl p-6 text-white relative shadow-glossy">
            <i className="fa-solid fa-check-to-slot absolute -right-4 -bottom-4 text-7xl opacity-10"></i>
            <h3 className="text-2xl font-black mb-1 relative z-10 leading-tight">{activeVote.title}</h3>
            <p className="text-white/60 font-bold text-xs relative z-10 uppercase tracking-widest">{activeVote.isMulti ? 'Bisa pilih lebih dari satu' : 'Hanya boleh pilih satu'}</p>
          </div>

          <div className="flex bg-white rounded-xl shadow-sm border border-slate-100 p-1">
             <button type="button" onClick={()=>setActiveTab('statistik')} className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-colors outline-none cursor-pointer ${activeTab==='statistik' ? 'bg-midnight text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>Statistik</button>
             <button type="button" onClick={()=>setActiveTab('sudah')} className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-colors outline-none cursor-pointer ${activeTab==='sudah' ? 'bg-midnight text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>Sudah ({sudahVoteNames.length})</button>
             <button type="button" onClick={()=>setActiveTab('belum')} className={`flex-1 py-2.5 text-xs font-bold rounded-lg transition-colors outline-none cursor-pointer ${activeTab==='belum' ? 'bg-midnight text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>Belum ({belumVoteNames.length})</button>
             <button type="button" onClick={()=>setActiveTab('beri_suara')} className={`flex-1 py-2.5 text-xs font-black rounded-lg transition-colors outline-none cursor-pointer ${activeTab==='beri_suara' ? 'bg-status-selesai text-white shadow-md' : 'text-status-selesai hover:bg-blue-50'}`}>Vote!</button>
          </div>

          {activeTab === 'statistik' && (
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-5 space-y-4 animate-fade-in">
               {activeVote.options.map((opt, i) => {
                  const count = optionCounts[opt];
                  const pct = totalSuaraMasuk === 0 ? 0 : Math.round((count / totalSuaraMasuk) * 100);
                  return (
                    <div key={i} className="mb-2">
                       <div className="flex justify-between text-xs font-bold text-midnight mb-1">
                          <span>{opt}</span><span>{count} Suara ({pct}%)</span>
                       </div>
                       <div className="w-full bg-slate-100 rounded-full h-3">
                          <div className="bg-status-selesai h-3 rounded-full" style={{width: `${pct}%`}}></div>
                       </div>
                    </div>
                  )
               })}
            </div>
          )}

          {activeTab === 'sudah' && (
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-5 space-y-3 animate-fade-in">
               {votesArray.length === 0 && <p className="text-center text-xs font-bold text-slate-400 py-4">Belum ada suara masuk.</p>}
               {votesArray.map(voteData => (
                 <div key={voteData.name} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span className="font-bold text-midnight text-xs">{voteData.name}</span>
                    <div className="flex gap-1 flex-wrap justify-end max-w-[60%]">
                      {voteData.options && voteData.options.map(opt => <span key={opt} className="bg-blue-50 border border-blue-100 text-status-selesai text-[9px] font-bold px-2 py-1 rounded-md truncate">{opt}</span>)}
                    </div>
                 </div>
               ))}
            </div>
          )}

          {activeTab === 'belum' && (
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-5 space-y-2 animate-fade-in">
               {belumVoteNames.length === 0 && <p className="text-center text-xs font-bold text-slate-400 py-4">Semua orang sudah memberikan suaranya!</p>}
               {belumVoteNames.map(name => (
                 <div key={name} className="bg-slate-50 p-3 rounded-xl border border-slate-100 font-bold text-slate-500 text-xs flex items-center gap-2">
                    <i className="fa-solid fa-circle-exclamation text-orange-400"></i> {name}
                 </div>
               ))}
            </div>
          )}

          {activeTab === 'beri_suara' && (
            <form onSubmit={handleCastVote} className="bg-white rounded-3xl shadow-soft border border-slate-100 p-5 space-y-5 animate-fade-in">
               <div>
                  <label className="block text-[10px] font-bold text-slate-500 mb-1 uppercase">Pilih Identitas Anda</label>
                  <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-bold text-midnight outline-none cursor-pointer" value={voteEmp} onChange={(e) => setVoteEmp(e.target.value)}>
                    <option value="">-- Nama Anda --</option>
                    {voters.map(v => <option key={v} value={v}>{v} {sudahVoteNames.includes(v) ? '(Ubah Pilihan)' : ''}</option>)}
                  </select>
               </div>
               {voteEmp && (
                 <div>
                    <label className="block text-[10px] font-bold text-slate-500 mb-2 uppercase">Pilihan Anda</label>
                    <div className="space-y-2">
                       {activeVote.options.map(opt => {
                         const isSelected = selectedOptions.includes(opt);
                         return (
                           <button type="button" key={opt} onClick={() => toggleOption(opt)} className={`w-full flex items-center justify-between p-3 rounded-xl border text-sm font-bold transition-colors outline-none cursor-pointer ${isSelected ? 'bg-blue-50 border-status-selesai text-status-selesai' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                              <span>{opt}</span>
                              {isSelected && <i className="fa-solid fa-circle-check"></i>}
                           </button>
                         )
                       })}
                    </div>
                 </div>
               )}
               <button type="submit" disabled={isSyncing} className="w-full bg-status-selesai text-white font-bold py-3.5 rounded-xl shadow-md active:scale-95 transition-all text-sm outline-none mt-2 cursor-pointer">
                  {isSyncing ? 'Mengirim...' : 'Kirim Suara'}
               </button>
            </form>
          )}
        </div>
      );
    };

    // --- MENU 6: ADMIN PANEL (SUPER ADMIN CRUD) ---
    const AdminPanel = ({ db, tasks, groupedTasks, employees, votings, isAdminLogged, setIsAdminLogged }) => {
      const [pwd, setPwd] = useState('');
      const [toast, setToast] = useState(null);
      const [isSyncing, setIsSyncing] = useState(false);
      const fileInputRef = useRef(null);

      const [newTask, setNewTask] = useState({ taskName: '', picId: '', target: '', deadline: '', multiTargets: {} });
      const [editModal, setEditModal] = useState({ isOpen: false, type: '', data: {}, oldTaskName: '' });

      const [voteTitle, setVoteTitle] = useState('');
      const [voteOptions, setVoteOptions] = useState(['']);
      const [isMulti, setIsMulti] = useState(false);
      const [editVoteModal, setEditVoteModal] = useState({ isOpen: false, id: null, title: '', options: [''], isMulti: false });

      const showToast = (type) => {
        setToast(type);
        setTimeout(() => setToast(null), 3000);
      };

      if (!isAdminLogged) {
        return (
          <div className="animate-slide-up text-center pt-10 px-4 max-w-sm mx-auto">
            <div className="bg-white border border-slate-200 text-midnight rounded-3xl w-24 h-24 flex items-center justify-center mx-auto mb-6 shadow-soft">
               <i className="fa-solid fa-user-shield text-5xl"></i>
            </div>
            <h3 className="text-2xl font-black text-midnight mb-2 tracking-tight">Super Admin</h3>
            <p className="text-xs text-slate-500 font-bold mb-6">Database dilindungi enkripsi sistem.</p>
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-6">
              <form onSubmit={e => { 
                e.preventDefault(); 
                if(btoa(pwd) === 'YWRtaW4xMjM=') { setIsAdminLogged(true); sessionStorage.setItem('adminAuth', 'true'); } 
                else { alert('Password Salah!'); setPwd(''); }
              }}>
                <input type="password" required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-center text-lg font-black text-midnight tracking-widest mb-4 focus:ring-2 focus:ring-midnight outline-none transition-all shadow-inner" placeholder="PASSWORD" value={pwd} onChange={e=>setPwd(e.target.value)}/>
                <button type="submit" className="w-full bg-midnight text-white font-bold py-3.5 rounded-xl shadow-glossy active:scale-95 transition-all flex justify-center items-center gap-2 outline-none cursor-pointer">
                  <i className="fa-solid fa-lock-open text-status-selesai"></i> Buka Panel
                </button>
              </form>
            </div>
          </div>
        );
      }

      const handleAddManual = async (e) => {
        e.preventDefault();
        if(!newTask.taskName || !newTask.picId || !newTask.deadline) { showToast('error'); return; }
        setIsSyncing(true);
        try {
          const updates = {};
          let addedCount = 0;
          const baseId = Date.now();
          const today = new Date().toISOString().split('T')[0];

          if (newTask.picId === 'all') {
             employees.forEach((emp, idx) => {
                const tgt = parseInt(newTask.multiTargets[emp.id]);
                if (tgt > 0) {
                   const newId = baseId + idx;
                   updates[`artifacts/${APP_ID}/public/data/tasks/${newId}`] = {
                      id: newId, taskName: newTask.taskName.trim(), picId: emp.name, target: tgt, progress: 0, deadline: newTask.deadline, status: 'On Progress', startDate: today
                   };
                   addedCount++;
                }
             });
          } else {
             const newId = baseId;
             updates[`artifacts/${APP_ID}/public/data/tasks/${newId}`] = {
                id: newId, taskName: newTask.taskName.trim(), picId: newTask.picId.toUpperCase().trim(), target: parseInt(newTask.target), progress: 0, deadline: newTask.deadline, status: 'On Progress', startDate: today
             };
             addedCount++;
          }

          if (addedCount > 0) {
             await db.ref().update(updates);
             showToast('success');
             setNewTask({ taskName: '', picId: '', target: '', deadline: '', multiTargets: {} });
          } else { showToast('error'); }
        } catch (err) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleExcelUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !db) return;
        setIsSyncing(true);
        const fileExt = file.name.toLowerCase().split('.').pop();
        const reader = new FileReader();

        reader.onload = async (event) => {
           try {
             let excelData = [];
             if (fileExt === 'csv') {
               const text = event.target.result;
               const workbook = window.XLSX.read(text, { type: 'string' });
               excelData = window.XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });
             } else {
               const data = new Uint8Array(event.target.result);
               const workbook = window.XLSX.read(data, { type: 'array' });
               excelData = window.XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });
             }

             const updates = {};
             let addedCount = 0;
             const today = new Date().toISOString().split('T')[0];

             for(let i = 1; i < excelData.length; i++) {
               const row = excelData[i];
               if (!row || row.length === 0) continue; 
               const taskName = String(row[0] || "").trim();
               const picIndicator = String(row[1] || "").trim(); 
               const target = parseInt(row[2]);
               
               if (!taskName || !picIndicator || isNaN(target)) continue;

               let finalDeadline = new Date().toISOString().split('T')[0];
               const rawDeadline = row[3];
               if (rawDeadline) {
                 if (typeof rawDeadline === 'number') {
                   const dateObj = new Date((rawDeadline - (25567 + 2)) * 86400 * 1000);
                   if(!isNaN(dateObj.getTime())) finalDeadline = dateObj.toISOString().split('T')[0];
                 } else {
                   const strDate = String(rawDeadline).trim();
                   const parts = strDate.split(/[-/]/);
                   if (parts.length === 3) {
                      if (parts[0].length <= 2 && parts[2].length === 4) finalDeadline = `${parts[2]}-${parts[1]}-${parts[0]}`; 
                      else { const d = new Date(strDate); if(!isNaN(d.getTime())) finalDeadline = d.toISOString().split('T')[0]; }
                   }
                 }
               }

               const newId = Date.now() + Math.floor(Math.random() * 10000) + i;
               updates[`artifacts/${APP_ID}/public/data/tasks/${newId}`] = {
                 id: newId, taskName: taskName, picId: picIndicator.toUpperCase(), 
                 target: target, progress: 0, deadline: finalDeadline, status: 'On Progress', startDate: today
               };
               addedCount++;
             }

             if (addedCount > 0) {
               await db.ref().update(updates); 
               showToast('success');
             } else { showToast('error'); }
           } catch (error) { showToast('error'); 
           } finally { setIsSyncing(false); if(fileInputRef.current) fileInputRef.current.value = ''; }
        };
        reader.onerror = () => { showToast('error'); setIsSyncing(false); };
        if (fileExt === 'csv') reader.readAsText(file); else reader.readAsArrayBuffer(file);
      };

      const handleSaveEdit = async (e) => {
        e.preventDefault();
        setIsSyncing(true);
        try {
          const updates = {};
          if (editModal.type === 'group') {
             const groupTasks = tasks.filter(t => t.taskName === editModal.oldTaskName);
             groupTasks.forEach(t => {
                updates[`artifacts/${APP_ID}/public/data/tasks/${t.id}/taskName`] = editModal.data.taskName.trim();
                updates[`artifacts/${APP_ID}/public/data/tasks/${t.id}/deadline`] = editModal.data.deadline;
             });
          } else {
             const target = parseInt(editModal.data.target);
             const progress = parseInt(editModal.data.progress);
             const isDone = progress >= target;
             const today = new Date().toISOString().split('T')[0];

             const oldTask = tasks.find(t => t.id === editModal.data.id);
             let completedAt = oldTask.completedAt;
             if (isDone && oldTask.status !== 'Selesai') completedAt = today;
             else if (!isDone) completedAt = null;
             else completedAt = oldTask.completedAt || null;

             updates[`artifacts/${APP_ID}/public/data/tasks/${editModal.data.id}`] = {
                ...oldTask,
                taskName: editModal.data.taskName.trim(),
                picId: editModal.data.picId.toUpperCase().trim(),
                target: target,
                progress: progress,
                deadline: editModal.data.deadline,
                status: isDone ? 'Selesai' : 'On Progress',
                completedAt: completedAt
             };
          }
          await db.ref().update(updates);
          showToast('success');
          setEditModal({ isOpen: false, type: '', data: {}, oldTaskName: '' });
        } catch (err) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleDeleteGroup = async (taskName) => {
        if(!window.confirm(`Hapus seluruh kegiatan "${taskName}" ?`)) return;
        setIsSyncing(true);
        try {
          const updates = {};
          const groupTasks = tasks.filter(t => t.taskName === taskName);
          groupTasks.forEach(t => { updates[`artifacts/${APP_ID}/public/data/tasks/${t.id}`] = null; });
          await db.ref().update(updates);
          showToast('success');
        } catch (e) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleResetGroupProgress = async (taskName) => {
        if(!window.confirm(`Reset progress "${taskName}" ke 0?`)) return;
        setIsSyncing(true);
        try {
          const updates = {};
          const groupTasks = tasks.filter(t => t.taskName === taskName);
          groupTasks.forEach(t => {
             updates[`artifacts/${APP_ID}/public/data/tasks/${t.id}/progress`] = 0;
             updates[`artifacts/${APP_ID}/public/data/tasks/${t.id}/status`] = 'On Progress';
             updates[`artifacts/${APP_ID}/public/data/tasks/${t.id}/completedAt`] = null;
          });
          await db.ref().update(updates);
          showToast('success');
        } catch (e) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleResetIndividualProgress = async (id) => {
        if(!window.confirm(`Reset progress pegawai ke 0?`)) return;
        setIsSyncing(true);
        try {
          await db.ref(`artifacts/${APP_ID}/public/data/tasks/${id}`).update({
             progress: 0, status: 'On Progress', completedAt: null
          });
          showToast('success');
        } catch (e) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleDeletePerson = async (id) => {
        if(!window.confirm(`Hapus pegawai dari kegiatan ini?`)) return;
        setIsSyncing(true);
        try { await db.ref(`artifacts/${APP_ID}/public/data/tasks/${id}`).remove(); showToast('success'); } 
        catch (e) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleCreateVoting = async (e) => {
        e.preventDefault();
        if(!db || employees.length === 0) { showToast('error'); return; }
        const cleanOptions = voteOptions.map(o => o.trim()).filter(o => o !== '');
        if(cleanOptions.length < 2) { showToast('error'); return; }

        setIsSyncing(true);
        try {
          const newId = Date.now();
          const today = new Date().toISOString().split('T')[0];
          const votersList = employees.map(e => e.name).sort((a, b) => a.localeCompare(b)); 
          
          await db.ref(`artifacts/${APP_ID}/public/data/votings/${newId}`).set({
             id: newId, title: voteTitle, options: cleanOptions, isMulti: isMulti, voters: votersList, createdAt: today, status: 'Active'
          });

          showToast('success');
          setVoteTitle(''); setVoteOptions(['']); setIsMulti(false);
        } catch (err) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleSaveEditVote = async (e) => {
        e.preventDefault();
        const cleanOptions = editVoteModal.options.map(o => o.trim()).filter(o => o !== '');
        if(cleanOptions.length < 2) { showToast('error'); return; }
        setIsSyncing(true);
        try {
          await db.ref(`artifacts/${APP_ID}/public/data/votings/${editVoteModal.id}`).update({
             title: editVoteModal.title,
             options: cleanOptions,
             isMulti: editVoteModal.isMulti
          });
          showToast('success');
          setEditVoteModal({ isOpen: false, id: null, title: '', options: [''], isMulti: false });
        } catch (err) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleDeleteVoting = async (voteId) => {
        if(!window.confirm(`Hapus  voting ini?`)) return;
        setIsSyncing(true);
        try { await db.ref(`artifacts/${APP_ID}/public/data/votings/${voteId}`).remove(); showToast('success'); } 
        catch (e) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleResetVoting = async (voteId) => {
        if(!window.confirm(`Hapus semua suara di voting ini?`)) return;
        setIsSyncing(true);
        try { await db.ref(`artifacts/${APP_ID}/public/data/votings/${voteId}/votes`).remove(); showToast('success'); } 
        catch (e) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleResetAll = async () => {
        if(!window.confirm("Yakin hapus SELURUH DATABASE?")) return;
        setIsSyncing(true);
        try {
          await db.ref(`artifacts/${APP_ID}/public/data/tasks`).remove();
          await db.ref(`artifacts/${APP_ID}/public/data/votings`).remove();
          showToast('success');
        } catch (e) { showToast('error'); }
        setIsSyncing(false);
      };

      const handleDownloadTemplate = () => {
        try {
          const templateData = [ ["Nama Kegiatan", "ID PIC / NAMA", "Target", "Deadline"], ["Review Laporan", "BUDI SANTOSO", 10, "2026-12-31"] ];
          const worksheet = window.XLSX.utils.aoa_to_sheet(templateData);
          const workbook = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(workbook, worksheet, "Template");
          window.XLSX.writeFile(workbook, "Template_MonitorSDMPKHTapin.xlsx");
        } catch (err) { showToast('error'); }
      };

      return (
        <div className="animate-slide-up space-y-6 pb-10 relative">
          
          {toast && (

                            </div>
                          ))}
                          <button type="button" onClick={() => setEditVoteModal({...editVoteModal, options: [...editVoteModal.options, '']})} className="text-xs font-bold text-status-selesai mt-1 outline-none cursor-pointer"><i className="fa-solid fa-plus mr-1"></i> Tambah Opsi</button>
                       </div>
                       <div className="flex items-center gap-3 bg-slate-50 p-3 rounded-xl border border-slate-200 mt-2">
                          <input type="checkbox" id="editMultiVote" checked={editVoteModal.isMulti} onChange={e => setEditVoteModal({...editVoteModal, isMulti: e.target.checked})} className="w-4 h-4 accent-blue-500 rounded outline-none cursor-pointer" />
                          <label htmlFor="editMultiVote" className="text-xs font-bold text-midnight cursor-pointer select-none">Multi Vote (Bisa Pilih > 1)</label>
                       </div>
                       <div className="pt-2">
                         <button type="submit" disabled={isSyncing} className="w-full bg-status-selesai text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition-all text-sm outline-none flex justify-center items-center gap-2 cursor-pointer">
                           {isSyncing ? <><i className="fa-solid fa-circle-notch fa-spin"></i> Menyimpan...</> : <><i className="fa-solid fa-floppy-disk"></i> Simpan Perubahan</>}
                         </button>
                       </div>
                    </form>
                 </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    // --- APP CORE (FIREBASE DIRECT CONNECT) ---
    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const previewParam = urlParams.get('preview');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [employees, setEmployees] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [votings, setVotings] = useState([]); 
      const [isLoading, setIsLoading] = useState(true);
      const [globalError, setGlobalError] = useState(null);
      const [selectedTaskName, setSelectedTaskName] = useState(null);
      const [selectedVoteId, setSelectedVoteId] = useState(null);
      const [db, setDb] = useState(null);
      
      const [isAdminLogged, setIsAdminLogged] = useState(() => sessionStorage.getItem('adminAuth') === 'true'); 

      useEffect(() => {
        try {
          if (!window.firebase) { console.error("Firebase tidak termuat"); return; }
          if (!window.firebase.apps.length) { window.firebase.initializeApp(firebaseConfig); }
          const database = window.firebase.database();
          setDb(database);
        } catch (e) {
          console.error(e);
          setIsLoading(false);
        }
      }, []);

      // LISTENER REALTIME FIREBASE (Tasks & Votings)
      useEffect(() => {
        if (!db) return;
        const loader = document.getElementById('native-loader');
        if (loader) loader.style.display = 'none';

        const tasksRef = db.ref(`artifacts/${APP_ID}/public/data/tasks`);
        const votingsRef = db.ref(`artifacts/${APP_ID}/public/data/votings`);
        
        const taskListener = tasksRef.on('value', (snapshot) => {
            const loadedTasks = [];
            snapshot.forEach(child => { loadedTasks.push({ id: child.key, ...child.val() }); });
            setTasks(loadedTasks);
            
            // Susun Abjad A-Z untuk dropdown list Pegawai
            const uniquePics = [...new Set(loadedTasks.map(t => t.picId))].sort((a, b) => a.localeCompare(b));
            setEmployees(uniquePics.map(pic => ({ id: pic, name: pic })));
            setIsLoading(false);
            setGlobalError(null);
        }, (error) => {
            setGlobalError("Gagal terhubung ke database Tasks");
            setIsLoading(false);
        });

        const votingListener = votingsRef.on('value', (snapshot) => {
            const loadedVotings = [];
            snapshot.forEach(child => { loadedVotings.push({ id: child.key, ...child.val() }); });
            setVotings(loadedVotings);
        });

        return () => { tasksRef.off('value', taskListener); votingsRef.off('value', votingListener); };
      }, [db]);

      const groupedTasks = useMemo(() => {
        const groups = {};
        tasks.forEach(t => {
          if (!groups[t.taskName]) groups[t.taskName] = { taskName: t.taskName, deadline: t.deadline, target: 0, progress: 0, assignees: [], status: 'Selesai' };
          groups[t.taskName].target += t.target;
          groups[t.taskName].progress += t.progress;
          groups[t.taskName].assignees.push(t);
          if (groups[t.taskName].progress < groups[t.taskName].target) groups[t.taskName].status = 'On Progress';
        });
        
        // Susun Abjad Assignees per Kegiatan
        Object.values(groups).forEach(g => {
           g.assignees.sort((a, b) => a.picId.localeCompare(b.picId));
        });

        return Object.values(groups).sort((a, b) => a.taskName.localeCompare(b.taskName));
      }, [tasks]);

      if (globalError) {
        return (
          <div className="min-h-screen flex flex-col gap-5 items-center justify-center bg-slate-50 p-6 text-center">
            <i className="fa-solid fa-triangle-exclamation text-red-500 text-7xl drop-shadow-md"></i>
            <h2 className="text-2xl font-black text-midnight">Koneksi Terhambat</h2>
            <p className="text-slate-600 font-bold bg-white border border-red-100 p-5 rounded-2xl shadow-soft text-sm max-w-sm"><span className="text-red-500 block mb-2">{globalError}</span></p>
            <button onClick={() => window.location.reload()} className="bg-midnight text-white px-8 py-3.5 rounded-full font-bold shadow-glossy mt-2 active:scale-95 transition-all outline-none cursor-pointer">Muat Ulang Layar</button>
          </div>
        );
      }

      if (isLoading) return <div className="min-h-screen flex flex-col gap-5 items-center justify-center bg-slate-50"><i className="fa-solid fa-circle-notch fa-spin text-status-selesai text-5xl drop-shadow-sm"></i><h5 className="font-black text-midnight text-sm uppercase tracking-widest">Menghubungkan ke Server...</h5></div>;

      // === ROUTING UNTUK LIVE PREVIEW EKSKLUSIF ===
      if (previewParam) {
        return <LivePreviewView taskName={previewParam} groupedTasks={groupedTasks} />;
      }

      return (
        <div className="app-container">
          <header className="bg-gradient-to-r from-midnight to-midnight-light text-white shadow-nav sticky top-0 z-50">
            <div className="px-4 sm:px-5 py-4 flex flex-row items-center justify-between">
              <a className="text-decoration-none font-black text-white flex items-center text-[16px] sm:text-xl tracking-tight" href="#">
                <div className="bg-white/10 border border-white/20 text-white rounded-xl p-1.5 mr-2 sm:mr-3 flex items-center justify-center shadow-inner backdrop-blur-sm" style={{width: '35px', height: '35px'}}>
                  <i className="fa-solid fa-chart-line text-yellow-400 text-base sm:text-lg"></i>
                </div>
                MonitorSDMPKHTapin
              </a>
              <span className="bg-white/10 border border-white/20 text-white rounded-full px-3 py-1.5 shadow-sm text-[9px] sm:text-[10px] font-bold uppercase tracking-wider backdrop-blur-sm flex items-center"><i className="fa-solid fa-cloud-arrow-up fa-fade mr-1.5 text-status-selesai"></i> Sync</span>
            </div>
          </header>

          <main className="p-5">
            {activeTab === 'dashboard' && <Dashboard groupedTasks={groupedTasks} votings={votings} setActiveTab={setActiveTab} setSelectedTaskName={setSelectedTaskName} setSelectedVoteId={setSelectedVoteId} />}
            {activeTab === 'kegiatan' && <DaftarKegiatan groupedTasks={groupedTasks} selectedTaskName={selectedTaskName} setSelectedTaskName={setSelectedTaskName} isAdminLogged={isAdminLogged} />}
            {activeTab === 'peringkat' && <Leaderboard groupedTasks={groupedTasks} />}
            {activeTab === 'input' && <ProgressForm tasks={tasks} employees={employees} db={db} />}
            {activeTab === 'voting' && <MenuVoting votings={votings} db={db} employees={employees} isAdminLogged={isAdminLogged} selectedVoteId={selectedVoteId} setSelectedVoteId={setSelectedVoteId} />}
            {activeTab === 'admin' && <AdminPanel db={db} tasks={tasks} groupedTasks={groupedTasks} votings={votings} employees={employees} isAdminLogged={isAdminLogged} setIsAdminLogged={setIsAdminLogged} />}
          </main>

          <nav className="fixed bottom-0 w-full max-w-[600px] left-1/2 -translate-x-1/2 bg-white rounded-t-[30px] shadow-[0_-10px_40px_rgba(11,19,43,0.08)] z-50 flex justify-around items-center px-1 sm:px-2 py-3 border-t border-slate-100">
            {[
              { id: 'dashboard', icon: 'fa-house', label: 'Home' },
              { id: 'kegiatan', icon: 'fa-list-check', label: 'Tugas' },
              { id: 'peringkat', icon: 'fa-ranking-star', label: 'Rank' },
              { id: 'input', icon: 'fa-pen-to-square', label: 'Lapor' },
              { id: 'voting', icon: 'fa-check-to-slot', label: 'Voting' },
              { id: 'admin', icon: 'fa-shield', label: 'Admin' }
            ].map(item => (
              <button type="button" key={item.id} onClick={() => { setActiveTab(item.id); setSelectedTaskName(null); setSelectedVoteId(null); }} 
                className={`flex flex-col items-center justify-center flex-1 min-w-[50px] gap-1.5 transition-all duration-300 outline-none cursor-pointer ${activeTab === item.id ? 'text-midnight scale-110' : 'text-slate-400 hover:text-slate-600'}`}>
                <i className={`fa-solid ${item.icon} text-[18px] sm:text-xl transition-transform ${activeTab === item.id ? 'drop-shadow-md text-status-selesai' : ''}`}></i>
                <span className="text-[8px] font-black uppercase tracking-wider">{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const initApp = () => {
      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
      }
    };
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
