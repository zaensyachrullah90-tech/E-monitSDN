<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MonitorPro - Premium Midnight</title>

  <!-- Mencegah layar blank akibat ekstensi browser Chrome/HP -->

      if(msg.includes("ResizeObserver")) return true;
      return false;

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: { DEFAULT: '#0B132B', light: '#1C2541', accent: '#3A506B' },
            status: { proses: '#10b981', selesai: '#3b82f6' }
          },
          boxShadow: {
            'glossy': '0 10px 25px -5px rgba(11, 19, 43, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1)',
            'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)'
          }
        }
      }

  </script>
  
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />

  <!-- FIREBASE REALTIME DATABASE (COMPAT VERSION) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <!-- React & Excel Dependencies -->

  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { background-color: #f4f6f9; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.3s ease-out forwards; }
    .card-btn { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; display: block; width: 100%; text-align: left; border: none; outline: none; }
    .card-btn:active { transform: scale(0.96); }
    input, select, button { outline: none; }
  </style>
</head>
<body class="text-slate-800 pb-24">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect, memo, Component } = React;

    // --- ERROR BOUNDARY ---
    class ErrorBoundary extends Component {
      constructor(props) { super(props); this.state = { hasError: false, errorMsg: '' }; }
      static getDerivedStateFromError(error) { return { hasError: true, errorMsg: error.toString() }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 bg-red-50 text-center">
               <i className="fa-solid fa-triangle-exclamation text-red-500 text-6xl mb-4"></i>
               <h2 className="text-xl font-black text-red-700 mb-2">Aplikasi Mengalami Kendala</h2>
               <p className="text-xs font-bold text-red-600 mb-6 bg-white p-3 rounded-lg border border-red-200">{this.state.errorMsg}</p>
               <button onClick={() => window.location.reload()} className="bg-red-600 text-white font-bold py-3 px-6 rounded-full">Muat Ulang Aplikasi</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // =========================================================================
    // 🔥 KONFIGURASI FIREBASE ANDA 
    // =========================================================================
    const firebaseConfig = {
        apiKey: "AIzaSyBEc1KmTOURFvVkUsGXb1Q_sTwX0tm_z9E",
        authDomain: "monit-kegiatan.firebaseapp.com",
        databaseURL: "https://monit-kegiatan-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "monit-kegiatan",
        storageBucket: "monit-kegiatan.firebasestorage.app",
        messagingSenderId: "778332842690",
        appId: "1:778332842690:web:a723b5200fda1f3391e95b"
    };
    const APP_ID = 'monit-kegiatan';
    // =========================================================================

    const formatDateId = (dateString) => {
      if (!dateString) return "-";
      const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      const parts = dateString.split("-");
      if(parts.length !== 3) return dateString;
      return `${parts[2]} ${months[parseInt(parts[1])-1]} ${parts[0]}`;
    };

    // --- KOMPONEN: LIVE COUNTDOWN KAPSUL ---
    const LiveCountdown = memo(({ deadline }) => {
      const [timeLeft, setTimeLeft] = useState('');
      const [isExpired, setIsExpired] = useState(false);

      useEffect(() => {
        const targetDate = new Date(`${deadline}T23:59:59`).getTime();
        const updateTimer = () => {
          const now = new Date().getTime();
          const distance = targetDate - now;
          if (isNaN(distance)) { setTimeLeft("--:--"); setIsExpired(true); return; }
          if (distance < 0) { setTimeLeft("WAKTU HABIS"); setIsExpired(true); return; }

          const d = Math.floor(distance / (1000 * 60 * 60 * 24));
          const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const s = Math.floor((distance % (1000 * 60)) / 1000);
          
          setTimeLeft(`${d > 0 ? d + ' Hr ' : ''}${h < 10 ? '0'+h : h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`);
          setIsExpired(d <= 2);
        };
        updateTimer();
        const interval = setInterval(updateTimer, 1000);
        return () => clearInterval(interval);
      }, [deadline]);

      return (
        <div className={`flex items-center gap-2 rounded-full px-3 py-1.5 shadow-sm border ${isExpired ? 'bg-red-600 border-red-500' : 'bg-midnight text-white border-midnight-accent'}`}>
          <i className={`fa-solid ${isExpired ? 'fa-triangle-exclamation fa-beat text-white' : 'fa-clock text-yellow-400'} text-xs`}></i>
          <div className="flex flex-col text-left">
            <span className="text-[8px] uppercase tracking-widest text-white/70 leading-none">Tenggat</span>
            <span className="font-mono font-bold text-xs text-white leading-none mt-1">{timeLeft}</span>
          </div>
        </div>
      );
    });

    // --- KOMPONEN: KARTU KEGIATAN ---
    const GroupedTaskCard = memo(({ group, onClick }) => {
      const percent = Math.min(Math.round((group.progress / group.target) * 100), 100);
      const isDone = percent >= 100;
      const borderColor = isDone ? 'border-status-selesai' : 'border-status-proses';
      const progressBg = isDone ? 'bg-status-selesai' : 'bg-status-proses';
      const percentColor = isDone ? 'text-status-selesai' : 'text-status-proses';
      
      return (
        <button type="button" className={`card-btn bg-white rounded-3xl shadow-soft border-l-[6px] ${borderColor} overflow-hidden`} onClick={() => onClick(group.taskName)}>
          <div className="p-5">
            <div className="flex justify-between items-start gap-3 mb-4">
              <div className="flex-1">
                <h5 className="font-black text-midnight text-lg leading-tight mb-2">{group.taskName}</h5>
                <span className="inline-flex items-center gap-1.5 bg-slate-50 border border-slate-200 text-slate-500 px-2 py-1 rounded-md text-[10px] font-bold uppercase tracking-wide">
                  <i className="fa-regular fa-calendar-check"></i> {formatDateId(group.deadline)}
                </span>
              </div>
              <LiveCountdown deadline={group.deadline} />
            </div>

            <div className="mb-4">
              <div className="flex justify-between text-xs font-bold mb-1.5">
                <span className="text-slate-500">Progress ({group.progress}/{group.target})</span>
                <span className={`font-black text-sm ${percentColor}`}>{percent}%</span>
              </div>
              <div className="w-full bg-slate-100 rounded-full h-2 shadow-inner">
                <div className={`${progressBg} h-2 rounded-full transition-all duration-1000 ease-out`} style={{ width: `${percent}%` }}></div>
              </div>
            </div>
            
            <div className="flex justify-between items-center pt-4 border-t border-slate-100/80">
              <div className="text-xs font-bold text-slate-500 flex items-center gap-1.5">
                <i className="fa-solid fa-users text-slate-400"></i> {group.assignees.length} Pelaksana
              </div>
              <div className="text-xs font-black text-white bg-midnight px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5">
                <i className="fa-solid fa-check-double text-blue-400"></i> Selesai: {group.assignees.filter(a => a.progress >= a.target).length}
              </div>
            </div>
          </div>
        </button>
      );
    });

    // --- MENU 1: DASHBOARD ---
    const Dashboard = ({ groupedTasks, setActiveTab, setSelectedTaskName }) => {
      const totalTasks = groupedTasks.length;
      const completedTasks = groupedTasks.filter(g => g.status === 'Selesai').length;
      const activeGroups = groupedTasks.filter(g => g.status === 'On Progress');
      
      return (
        <div className="animate-slide-up space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h3 className="text-2xl font-black text-midnight tracking-tight">Beranda</h3>
              <p className="text-slate-500 text-sm font-bold mt-0.5">Ringkasan Evaluasi Kinerja</p>
            </div>
          </div>
          
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-gradient-to-br from-midnight to-midnight-light rounded-3xl shadow-glossy p-5 text-white relative overflow-hidden flex items-center justify-between">
              <i className="fa-solid fa-layer-group absolute -right-4 -bottom-4 text-7xl opacity-20"></i>
              <div className="relative z-10">
                <h6 className="text-[10px] text-white/70 uppercase tracking-widest font-bold mb-1">Semua Kegiatan</h6>
                <h2 className="text-4xl font-black">{totalTasks}</h2>
              </div>
              <div className="bg-white/10 p-3 rounded-2xl backdrop-blur-sm relative z-10 border border-white/10">
                <i className="fa-solid fa-chart-pie text-xl"></i>
              </div>
            </div>
            
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-5 flex flex-col justify-center items-center text-center">
              <div className="bg-status-selesai/10 text-status-selesai w-12 h-12 rounded-full flex items-center justify-center mb-3">
                <i className="fa-solid fa-check-circle text-2xl"></i>
              </div>
              <h2 className="text-3xl font-black text-midnight mb-1">{completedTasks}</h2>
              <h6 className="text-xs text-slate-500 font-bold uppercase tracking-wider">Telah Selesai</h6>
            </div>
            
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-5 flex flex-col justify-center items-center text-center">
              <div className="bg-status-proses/10 text-status-proses w-12 h-12 rounded-full flex items-center justify-center mb-3">
                <i className="fa-solid fa-person-digging text-2xl"></i>
              </div>
              <h2 className="text-3xl font-black text-midnight mb-1">{totalTasks - completedTasks}</h2>
              <h6 className="text-xs text-slate-500 font-bold uppercase tracking-wider">Sedang Proses</h6>
            </div>
          </div>

          <div>
            <h5 className="font-bold text-midnight mb-4 flex items-center gap-2">
              <i className="fa-solid fa-fire-flame-curved text-red-500 text-lg"></i> Mendesak (Tenggat Terdekat)
            </h5>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {activeGroups.sort((a, b) => new Date(a.deadline) - new Date(b.deadline)).slice(0, 4).map(group => (
                <GroupedTaskCard key={group.taskName} group={group} onClick={(name) => { setSelectedTaskName(name); setActiveTab('kegiatan'); }} />
              ))}
              {activeGroups.length === 0 && (
                <div className="col-span-full bg-white rounded-3xl shadow-soft border border-slate-100 text-center py-10">
                  <i className="fa-solid fa-mug-hot d-block text-5xl mb-4 text-slate-300"></i> 
                  <h5 className="font-black text-midnight text-lg mb-1">Pekerjaan Tuntas!</h5>
                  <p className="text-slate-500 text-sm font-medium">Tidak ada kegiatan yang berjalan saat ini.</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // --- MENU 2: KEGIATAN & EVALUASI DETAIL ---
    const DaftarKegiatan = ({ groupedTasks, selectedTaskName, setSelectedTaskName }) => {
      const activeGroup = groupedTasks.find(g => g.taskName === selectedTaskName);

      if (activeGroup) {
        const totalPelaksana = activeGroup.assignees.length;
        const selesaiCount = activeGroup.assignees.filter(a => a.progress >= a.target).length;
        const belumCount = totalPelaksana - selesaiCount;

        return (
          <div className="animate-slide-up space-y-5">
            <button onClick={() => setSelectedTaskName(null)} className="bg-white text-midnight border border-slate-200 shadow-sm rounded-full font-bold px-5 py-2 text-sm flex items-center gap-2 hover:bg-slate-50 transition-colors">
              <i className="fa-solid fa-arrow-left-long text-status-selesai"></i> Kembali
            </button>
            
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 overflow-hidden">
              <div className="bg-gradient-to-r from-midnight to-midnight-light p-6 text-white relative">
                <div className="absolute top-0 right-0 p-4 opacity-10"><i className="fa-solid fa-folder-open text-8xl"></i></div>
                <span className={`inline-flex items-center gap-1.5 ${activeGroup.status === 'Selesai' ? 'bg-status-selesai' : 'bg-white text-status-proses'} text-xs font-black px-3 py-1.5 rounded-lg mb-4 shadow-sm uppercase tracking-wider`}>
                  <i className={`fa-solid ${activeGroup.status === 'Selesai' ? 'fa-check-double text-white' : 'fa-spinner fa-spin'}`}></i> {activeGroup.status}
                </span>
                <h3 className="text-2xl font-black mb-2 relative z-10 leading-tight">{activeGroup.taskName}</h3>
                <p className="text-white/80 font-bold text-sm m-0 flex items-center gap-2 relative z-10">
                  <i className="fa-solid fa-calendar-day text-blue-300"></i> Tenggat: {formatDateId(activeGroup.deadline)}
                </p>
              </div>
              
              <div className="p-6">
                <div className="grid grid-cols-3 gap-3 mb-6">
                  <div className="bg-slate-50 rounded-2xl border border-slate-100 p-3 text-center flex flex-col justify-center">
                    <h2 className="text-2xl font-black text-midnight mb-0.5">{totalPelaksana}</h2>
                    <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Pelaksana</span>
                  </div>
                  <div className="bg-status-selesai/10 rounded-2xl border border-status-selesai/20 p-3 text-center flex flex-col justify-center">
                    <h2 className="text-2xl font-black text-status-selesai mb-0.5">{selesaiCount}</h2>
                    <span className="text-[10px] text-status-selesai font-bold uppercase tracking-wider">Selesai</span>
                  </div>
                  <div className="bg-status-proses/10 rounded-2xl border border-status-proses/20 p-3 text-center flex flex-col justify-center">
                    <h2 className="text-2xl font-black text-status-proses mb-0.5">{belumCount}</h2>
                    <span className="text-[10px] text-status-proses font-bold uppercase tracking-wider">Proses</span>
                  </div>
                </div>

                <h6 className="font-black text-midnight mb-4 flex items-center gap-2 text-sm uppercase tracking-wider border-b border-slate-100 pb-3">
                  <i className="fa-solid fa-list-check text-slate-400"></i> Rincian Capaian Pegawai
                </h6>
                <div className="space-y-3">
                  {activeGroup.assignees.map((a, idx) => {
                    const isDone = a.progress >= a.target;
                    const badgeBg = isDone ? 'bg-status-selesai border-status-selesai text-white' : 'bg-white border-status-proses border-2 text-status-proses';
                    const iconClass = isDone ? 'fa-solid fa-circle-check text-white' : 'fa-solid fa-spinner fa-spin text-status-proses';
                    
                    return (
                      <div key={idx} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm">
                        <div>
                          <div className="font-bold text-midnight text-sm mb-1">{a.picId}</div>
                          <div className="text-xs text-slate-500 font-medium">Capaian: <span className="font-bold text-midnight">{a.progress}</span> / {a.target}</div>
                        </div>
                        <span className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold shadow-sm ${badgeBg}`}>
                          <i className={iconClass}></i> {isDone ? 'Selesai' : 'Proses'}
                        </span>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="animate-slide-up space-y-6">
          <div>
            <h3 className="text-2xl font-black text-midnight tracking-tight">Seluruh Kegiatan</h3>
            <p className="text-slate-500 text-sm font-bold mt-0.5"><i className="fa-solid fa-hand-pointer text-status-selesai mr-1"></i> Klik kartu untuk evaluasi mendalam.</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {groupedTasks.length === 0 && (
              <div className="col-span-full bg-white rounded-3xl shadow-soft border border-slate-100 text-center py-12">
                <i className="fa-solid fa-box-open d-block text-5xl mb-4 text-slate-300"></i>
                <p className="font-black text-slate-500">Belum ada kegiatan terdaftar.</p>
              </div>
            )}
            {groupedTasks.map(group => <GroupedTaskCard key={group.taskName} group={group} onClick={setSelectedTaskName} />)}
          </div>
        </div>
      );
    };

    // --- MENU 3: LEADERBOARD ---
    const Leaderboard = ({ tasks, employees }) => {
      const stats = useMemo(() => {
        return employees.map(emp => {
          const empTasks = tasks.filter(t => String(t.picId) === String(emp.id));
          const totalTarget = empTasks.reduce((sum, t) => sum + t.target, 0);
          const totalProgress = empTasks.reduce((sum, t) => sum + t.progress, 0);
          const percent = totalTarget === 0 ? 0 : Math.min(Math.round((totalProgress / totalTarget) * 100), 100);
          return { ...emp, totalTarget, totalProgress, percent, taskCount: empTasks.length };
        }).sort((a, b) => b.percent - a.percent);
      }, [tasks, employees]);

      return (
        <div className="animate-slide-up space-y-6">
          <div>
            <h3 className="text-2xl font-black text-midnight tracking-tight">Leaderboard</h3>
            <p className="text-slate-500 text-sm font-bold mt-0.5">Peringkat kinerja pegawai secara global.</p>
          </div>
          
          <div className="bg-white rounded-3xl shadow-soft border border-slate-100 overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-wider font-bold border-b border-slate-200">
                    <th className="p-4 text-center">#</th>
                    <th className="p-4">Pegawai</th>
                    <th className="p-4 text-center">Beban</th>
                    <th className="p-4">Kinerja</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {stats.length === 0 && <tr><td colSpan="4" className="text-center py-10 text-slate-400 font-bold">Belum ada data pegawai</td></tr>}
                  {stats.map((stat, index) => (
                    <tr key={stat.id} className="hover:bg-slate-50 transition-colors">
                      <td className="p-4 text-center">
                        {index === 0 ? <span className="bg-gradient-to-br from-yellow-300 to-yellow-500 text-white w-8 h-8 rounded-full flex items-center justify-center mx-auto shadow-sm text-sm"><i className="fa-solid fa-crown"></i></span> : 
                         index === 1 ? <span className="bg-slate-800 text-white w-8 h-8 rounded-full flex items-center justify-center mx-auto shadow-sm text-sm font-bold">2</span> : 
                         index === 2 ? <span className="bg-slate-600 text-white w-8 h-8 rounded-full flex items-center justify-center mx-auto shadow-sm text-sm font-bold">3</span> : 
                         <span className="text-slate-400 font-bold text-sm">{index + 1}</span>}
                      </td>
                      <td className="p-4 font-black text-midnight text-sm">{stat.name}</td>
                      <td className="p-4 text-center">
                        <span className="bg-slate-100 text-slate-600 border border-slate-200 rounded-lg px-2 py-1 text-xs font-bold">{stat.taskCount}</span>
                      </td>
                      <td className="p-4 min-w-[120px]">
                        <div className="flex items-center gap-3">
                          <div className="w-full bg-slate-100 rounded-full h-2.5 shadow-inner">
                            <div className={`${stat.percent >= 100 ? 'bg-status-selesai' : 'bg-status-proses'} h-2.5 rounded-full`} style={{ width: `${stat.percent}%` }}></div>
                          </div>
                          <span className="text-xs font-black text-midnight">{stat.percent}%</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    // --- MENU 4: INPUT PROGRES (REALTIME DB LOGIC) ---
    const ProgressForm = ({ tasks, employees, user, db }) => {
      const [selectedEmp, setSelectedEmp] = useState('');
      const [selectedTask, setSelectedTask] = useState('');
      const [amount, setAmount] = useState('');
      const [message, setMessage] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);

      const availableTasks = tasks.filter(t => String(t.picId) === String(selectedEmp) && t.status === 'On Progress');

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!user || !db) { alert("Sistem belum siap. Tunggu Sebentar."); return; }
        setIsSyncing(true);
        try {
          const task = tasks.find(t => String(t.id) === String(selectedTask));
          const newProgress = Math.min(task.progress + parseInt(amount), task.target);
          const isDone = newProgress >= task.target;
          
          // REALTIME DATABASE UPDATE
          await db.ref(`artifacts/${APP_ID}/public/data/tasks/${task.id}`).update({ 
              progress: newProgress, status: isDone ? 'Selesai' : 'On Progress' 
          });

          setAmount('');
          setMessage(`Laporan berhasil dikirim. ${isDone ? 'Kegiatan Selesai!' : ''}`);
          setTimeout(() => setMessage(''), 4000);
        } catch (err) { alert("Gagal mengirim laporan. Pastikan internet lancar."); }
        setIsSyncing(false);
      };

      return (
        <div className="animate-slide-up max-w-lg mx-auto space-y-6">
          <div className="text-center mt-4">
            <div className="bg-gradient-to-br from-midnight to-midnight-light text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-glossy">
               <i className="fa-solid fa-pen-to-square text-3xl"></i>
            </div>
            <h3 className="text-2xl font-black text-midnight tracking-tight">Lapor Progres</h3>
            <p className="text-slate-500 text-sm font-bold mt-1">Kirim hasil pekerjaan harian Anda.</p>
          </div>

          {message && (
            <div className="bg-midnight text-white p-4 rounded-2xl shadow-lg font-bold flex items-center gap-3 animate-slide-up text-sm">
              <i className="fa-solid fa-circle-check text-status-selesai text-xl"></i> {message}
            </div>
          )}
          
          <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-6 md:p-8">
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-xs font-black text-midnight mb-2 uppercase tracking-wider"><i className="fa-solid fa-user-tag text-slate-400 mr-2"></i>Pilih Identitas</label>
                <select required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-bold text-midnight focus:ring-2 focus:ring-midnight transition-all shadow-inner" value={selectedEmp} onChange={(e) => { setSelectedEmp(e.target.value); setSelectedTask(''); }}>
                  <option value="">-- Ketuk untuk memilih --</option>
                  {employees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
                </select>
              </div>
              
              {selectedEmp && (
                <div className="animate-slide-up">
                  <label className="block text-xs font-black text-midnight mb-2 uppercase tracking-wider"><i className="fa-solid fa-list-check text-slate-400 mr-2"></i>Pilih Pekerjaan Aktif</label>
                  <select required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm font-bold text-midnight focus:ring-2 focus:ring-midnight transition-all shadow-inner" value={selectedTask} onChange={(e) => setSelectedTask(e.target.value)}>
                    <option value="">-- Pilih Pekerjaan --</option>
                    {availableTasks.map(t => <option key={t.id} value={t.id}>{t.taskName} (Sisa: {t.target - t.progress})</option>)}
                  </select>
                </div>
              )}
              
              {selectedTask && (
                <div className="animate-slide-up">
                  <label className="block text-xs font-black text-midnight mb-2 uppercase tracking-wider"><i className="fa-solid fa-arrow-up-9-1 text-slate-400 mr-2"></i>Jumlah Diselesaikan</label>
                  <input type="number" required min="1" className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 text-3xl text-center font-black text-status-selesai focus:ring-2 focus:ring-status-selesai transition-all shadow-inner placeholder:text-slate-300" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" />
                </div>
              )}
              
              <button type="submit" disabled={!selectedTask || isSyncing} className="w-full bg-gradient-to-r from-midnight to-midnight-light text-white font-bold py-4 rounded-xl shadow-glossy hover:opacity-90 active:scale-95 transition-all disabled:opacity-50 flex justify-center items-center gap-2 mt-2 outline-none">
                {isSyncing ? <><i className="fa-solid fa-circle-notch fa-spin text-white"></i> Memproses...</> : <><i className="fa-solid fa-paper-plane text-status-selesai"></i> Kirim Laporan</>}
              </button>
            </form>
          </div>
        </div>
      );
    };

    // --- MENU 5: ADMIN PANEL (REALTIME DB LOGIC) ---
    const AdminPanel = ({ db, tasks, groupedTasks, user, isAdminLogged, setIsAdminLogged }) => {
      const [pwd, setPwd] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const [errorMsg, setErrorMsg] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);
      const fileInputRef = useRef(null);

      if (!isAdminLogged) {
        return (
          <div className="animate-slide-up text-center pt-10 px-4 max-w-sm mx-auto">
            <div className="bg-white border border-slate-200 text-midnight rounded-3xl w-24 h-24 flex items-center justify-center mx-auto mb-6 shadow-soft">
               <i className="fa-solid fa-shield-halved text-5xl"></i>
            </div>
            <h3 className="text-2xl font-black text-midnight mb-6 tracking-tight">Akses Admin</h3>
            <div className="bg-white rounded-3xl shadow-soft border border-slate-100 p-6">
              <form onSubmit={e => { 
                e.preventDefault(); 
                if(pwd === 'admin123') { setIsAdminLogged(true); sessionStorage.setItem('adminAuth', 'true'); } 
                else { alert('Password Salah!'); setPwd(''); }
              }}>
                <input type="password" required className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-center text-lg font-black text-midnight tracking-widest mb-4 focus:ring-2 focus:ring-midnight outline-none transition-all shadow-inner" placeholder="PASSWORD" value={pwd} onChange={e=>setPwd(e.target.value)}/>
                <button className="w-full bg-midnight text-white font-bold py-3.5 rounded-xl shadow-glossy active:scale-95 transition-all flex justify-center items-center gap-2 outline-none">
                  <i className="fa-solid fa-lock-open text-status-selesai"></i> Buka Panel
                </button>
              </form>
            </div>
          </div>
        );
      }

      // FUNGSI UPLOAD CSV/EXCEL UNTUK REALTIME DATABASE
      const handleExcelUpload = (e) => {
        const file = e.target.files[0];
        if (!file || !db) return;

        setIsSyncing(true); setErrorMsg(''); setSuccessMsg('');
        
        const fileExt = file.name.toLowerCase().split('.').pop();
        const reader = new FileReader();

        reader.onload = async (event) => {
           try {
             let excelData = [];
             
             if (fileExt === 'csv') {
               const text = event.target.result;
               const workbook = window.XLSX.read(text, { type: 'string' });
               excelData = window.XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });
             } else {
               const data = new Uint8Array(event.target.result);
               const workbook = window.XLSX.read(data, { type: 'array' });
               excelData = window.XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });
             }

             const updates = {};
             let addedCount = 0;

             for(let i = 1; i < excelData.length; i++) {
               const row = excelData[i];
               if (!row || row.length === 0) continue; 

               const taskName = String(row[0] || "").trim();
               const picIndicator = String(row[1] || "").trim(); 
               const target = parseInt(row[2]);
               
               if (!taskName || !picIndicator || isNaN(target)) continue;

               let finalDeadline = new Date().toISOString().split('T')[0];
               const rawDeadline = row[3];
               if (rawDeadline) {
                 if (typeof rawDeadline === 'number') {
                   const dateObj = new Date((rawDeadline - (25567 + 2)) * 86400 * 1000);
                   if(!isNaN(dateObj.getTime())) finalDeadline = dateObj.toISOString().split('T')[0];
                 } else {
                   const strDate = String(rawDeadline).trim();
                   const parts = strDate.split(/[-/]/);
                   if (parts.length === 3) {
                      if (parts[0].length <= 2 && parts[2].length === 4) finalDeadline = `${parts[2]}-${parts[1]}-${parts[0]}`; 
                      else { const d = new Date(strDate); if(!isNaN(d.getTime())) finalDeadline = d.toISOString().split('T')[0]; }
                   }
                 }
               }

               const newId = Date.now() + Math.floor(Math.random() * 10000) + i;
               
               // Multi-path update untuk Realtime Database
               updates[`artifacts/${APP_ID}/public/data/tasks/${newId}`] = {
                 id: newId, taskName: taskName, picId: picIndicator.toUpperCase(), 
                 target: target, progress: 0, deadline: finalDeadline, status: 'On Progress'
               };
               addedCount++;
             }

             if (addedCount > 0) {
               try {
                 await db.ref().update(updates); 
                 setSuccessMsg(`BERHASIL! ${addedCount} kegiatan masuk ke database.`); 
                 setTimeout(() => setSuccessMsg(''), 6000);
               } catch (fbError) {
                 setErrorMsg("UPLOAD DITOLAK! Pastikan 'Rules' Firebase Anda sudah diganti menjadi .read: true dan .write: true");
               }
             } else { setErrorMsg("Data Kosong. File harus berisi isian data."); }
           } catch (error) { 
             setErrorMsg("Format file gagal terbaca. Harus .xlsx atau .csv"); 
           } finally {
             setIsSyncing(false); if(fileInputRef.current) fileInputRef.current.value = '';
           }
        };

        reader.onerror = () => {
           setErrorMsg("Gagal membaca file.");
           setIsSyncing(false);
        };

        if (fileExt === 'csv') reader.readAsText(file);
        else reader.readAsArrayBuffer(file);
      };

      const handleDeleteGroup = async (taskName) => {
        if(!window.confirm(`HAPUS PERMANEN seluruh kegiatan "${taskName}" ?`)) return;
        setIsSyncing(true);
        try {
          const updates = {};
          const groupTasks = tasks.filter(t => t.taskName === taskName);
          groupTasks.forEach(t => {
             updates[`artifacts/${APP_ID}/public/data/tasks/${t.id}`] = null;
          });
          await db.ref().update(updates);
        } catch (e) { alert("Gagal menghapus."); }
        setIsSyncing(false);
      };

      const handleDeletePerson = async (id, name) => {
        if(!window.confirm(`Hapus pegawai "${name}" dari kegiatan ini?`)) return;
        setIsSyncing(true);
        try {
          await db.ref(`artifacts/${APP_ID}/public/data/tasks/${id}`).remove();
        } catch (e) { alert("Gagal menghapus."); }
        setIsSyncing(false);
      };

      const handleResetAll = async () => {
        if(!window.confirm("BAHAYA! Yakin hapus SELURUH DATABASE? Aksi ini tidak bisa dibatalkan!")) return;
        setIsSyncing(true);
        try {
          await db.ref(`artifacts/${APP_ID}/public/data/tasks`).remove();
          setSuccessMsg('Seluruh database berhasil dikosongkan!'); setTimeout(() => setSuccessMsg(''), 5000);
        } catch (e) { alert("Gagal mereset."); }
        setIsSyncing(false);
      };

      const handleDownloadTemplate = () => {
        try {
          const templateData = [ ["Nama Kegiatan", "ID PIC / NAMA", "Target", "Deadline"], ["Review Laporan", "BUDI SANTOSO", 10, "2026-12-31"] ];
          const worksheet = window.XLSX.utils.aoa_to_sheet(templateData);
          const workbook = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(workbook, worksheet, "Template");
          window.XLSX.writeFile(workbook, "Template_MonitorPro.xlsx");
        } catch (err) { alert("Download gagal."); }
      };

      return (
        <div className="animate-slide-up space-y-6">
          <div className="flex justify-between items-center">
            <h3 className="text-2xl font-black text-midnight tracking-tight">Panel Admin</h3>
            <button onClick={() => { setIsAdminLogged(false); sessionStorage.removeItem('adminAuth'); }} className="bg-white border border-slate-200 text-red-500 font-bold px-4 py-1.5 rounded-full shadow-sm text-xs flex items-center gap-1.5 hover:bg-slate-50 transition-colors outline-none">
              <i className="fa-solid fa-power-off"></i> Keluar
            </button>
          </div>
          
          {successMsg && <div className="bg-midnight text-white p-4 rounded-2xl shadow-lg font-bold flex items-center gap-3 animate-slide-up text-sm"><i className="fa-solid fa-circle-check text-status-selesai text-xl"></i> {successMsg}</div>}
          {errorMsg && <div className="bg-red-50 border border-red-200 text-red-600 p-4 rounded-2xl shadow-lg font-bold flex flex-col gap-2 animate-slide-up text-sm">
            <div className="flex items-center gap-2"><i className="fa-solid fa-triangle-exclamation text-xl"></i> <span>ERROR UPLOAD:</span></div>
            <span className="font-medium text-xs">{errorMsg}</span>
          </div>}
          
          <div className="bg-gradient-to-br from-midnight to-midnight-light rounded-3xl p-6 text-white relative overflow-hidden shadow-glossy">
            <i className="fa-solid fa-cloud-arrow-up absolute -right-8 -bottom-8 text-9xl opacity-10 text-white"></i>
            <div className="relative z-10">
              <h4 className="text-xl font-black mb-1 flex items-center gap-2"><i className="fa-solid fa-database text-status-selesai"></i> Upload Database</h4>
              <p className="text-white/60 text-xs font-bold mb-5 leading-relaxed max-w-sm">File CSV/XLSX. Kolom A=Kegiatan, B=Nama, C=Target, D=Tanggal.</p>
              
              <button onClick={handleDownloadTemplate} className="bg-white/10 hover:bg-white/20 text-white border border-white/20 font-bold px-4 py-2 rounded-full text-xs transition-colors mb-5 flex items-center gap-2 backdrop-blur-md outline-none">
                <i className="fa-solid fa-download"></i> Template Excel
              </button>

              <input type="file" accept=".xlsx, .csv" ref={fileInputRef} onChange={handleExcelUpload} className="hidden" />
              <button onClick={() => fileInputRef.current.click()} disabled={isSyncing || !user} className="w-full bg-white text-midnight font-black py-3.5 rounded-xl shadow-soft hover:bg-slate-50 transition-colors flex justify-center items-center gap-2 outline-none">
                 {isSyncing ? <><i className="fa-solid fa-circle-notch fa-spin text-status-selesai"></i> Mengekstrak...</> : <><i className="fa-solid fa-file-excel text-emerald-500"></i> Pilih File Data</>}
              </button>
            </div>
          </div>

          <div className="bg-white rounded-3xl shadow-soft border border-slate-100 overflow-hidden">
            <div className="bg-slate-50 border-b border-slate-100 p-4 px-5 flex items-center gap-2">
              <i className="fa-solid fa-trash-can text-red-500"></i> <span className="font-black text-midnight text-sm uppercase tracking-wider">Manajemen Hapus</span>
            </div>
            <div className="p-5 space-y-4">
               <button onClick={handleResetAll} disabled={isSyncing || !user} className="w-full bg-red-50 text-red-600 border border-red-200 font-black py-3.5 rounded-xl shadow-sm hover:bg-red-100 transition-colors flex justify-center items-center gap-2 mb-2 outline-none">
                 <i className="fa-solid fa-skull-crossbones"></i> FORMAT KOSONG DATABASE
               </button>

               <h6 className="font-bold text-midnight text-xs uppercase tracking-wider border-b border-slate-100 pb-2 mb-3 mt-5">Hapus Spesifik:</h6>
               {groupedTasks.length === 0 && <p className="text-center py-6 text-slate-400 font-bold text-sm bg-slate-50 rounded-xl">Database masih kosong.</p>}
               
               <div className="space-y-3">
                 {groupedTasks.map(g => (
                   <details key={g.taskName} className="group bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden [&_summary::-webkit-details-marker]:hidden">
                     <summary className="p-4 font-bold text-midnight flex justify-between items-center cursor-pointer select-none outline-none">
                       <span className="flex items-center gap-3">
                         <i className="fa-solid fa-folder text-status-selesai group-open:text-status-proses transition-colors"></i> 
                         <span className="truncate max-w-[150px] sm:max-w-xs">{g.taskName}</span>
                         <span className="bg-midnight text-white text-[10px] px-2 py-0.5 rounded-md">{g.assignees.length} Org</span>
                       </span>
                       <button onClick={(e) => { e.preventDefault(); handleDeleteGroup(g.taskName); }} className="bg-white border border-red-200 text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg text-xs transition-colors shadow-sm outline-none"><i className="fa-solid fa-trash"></i></button>
                     </summary>
                     <div className="px-4 pb-4 pt-1 space-y-2">
                       {g.assignees.map(a => (
                         <div key={a.id} className="flex justify-between items-center bg-white border border-slate-100 p-3 rounded-xl">
                           <div className="text-xs font-bold text-midnight flex items-center gap-2"><i className="fa-solid fa-user-tag text-slate-300"></i> {a.picId}</div>
                           <button onClick={() => handleDeletePerson(a.id, a.picId)} className="bg-red-50 text-red-500 w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-100 transition-colors outline-none"><i className="fa-solid fa-xmark"></i></button>
                         </div>
                       ))}
                     </div>
                   </details>
                 ))}
               </div>
            </div>
          </div>

        </div>
      );
    };

    // --- APP CORE (REALTIME DB LISTENER) ---
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [employees, setEmployees] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [globalError, setGlobalError] = useState(null);
      const [selectedTaskName, setSelectedTaskName] = useState(null);
      const [user, setUser] = useState(null);
      const [db, setDb] = useState(null);
      
      const [isAdminLogged, setIsAdminLogged] = useState(() => sessionStorage.getItem('adminAuth') === 'true'); 

      // INIT FIREBASE PINTAR
      useEffect(() => {
        let isMounted = true;
        const initFirebase = async () => {
          try {
            if (!window.firebase.apps.length) { 
              window.firebase.initializeApp(firebaseConfig); 
            }
            // MENGGUNAKAN DATABASE REALTIME BUKAN FIRESTORE
            const database = window.firebase.database();
            if (isMounted) setDb(database);
            
            const auth = window.firebase.auth();
            try {
              await auth.signInAnonymously();
            } catch (authErr) {
              if (isMounted) {
                setGlobalError("Gagal login! Aktifkan mode 'Anonymous' di menu Authentication Firebase Anda.");
                setIsLoading(false);
              }
              return;
            }

            auth.onAuthStateChanged(u => {
              if (isMounted) setUser(u);
            });

          } catch (e) {
            if (isMounted) {
              setGlobalError("Gagal menghubungi server database.");
              setIsLoading(false);
            }
          }
        };
        initFirebase();
        
        const fallbackTimer = setTimeout(() => {
           if (isMounted && isLoading) {
              setGlobalError("Waktu tunggu habis (Timeout). Internet lambat atau Firebase diblokir.");
              setIsLoading(false);
           }
        }, 10000);

        return () => { isMounted = false; clearTimeout(fallbackTimer); }
      }, []);

      // LISTENER REALTIME DATABASE
      useEffect(() => {
        if (!user || !db) return;
        const ref = db.ref(`artifacts/${APP_ID}/public/data/tasks`);
        
        const listener = ref.on('value', (snapshot) => {
            const loadedTasks = [];
            snapshot.forEach(childSnapshot => {
                loadedTasks.push({ id: childSnapshot.key, ...childSnapshot.val() });
            });
            
            setTasks(loadedTasks);
            const uniquePics = [...new Set(loadedTasks.map(t => t.picId))];
            setEmployees(uniquePics.map(pic => ({ id: pic, name: pic })));
            
            setIsLoading(false);
            setGlobalError(null);
        }, (error) => {
            console.error(error);
            setGlobalError("Izin Database ditolak! Pastikan Rules Realtime Database Anda telah diubah menjadi: .read: true, .write: true");
            setIsLoading(false);
        });

        return () => ref.off('value', listener);
      }, [user, db]);

      const groupedTasks = useMemo(() => {
        const groups = {};
        tasks.forEach(t => {
          if (!groups[t.taskName]) groups[t.taskName] = { taskName: t.taskName, deadline: t.deadline, target: 0, progress: 0, assignees: [], status: 'Selesai' };
          groups[t.taskName].target += t.target;
          groups[t.taskName].progress += t.progress;
          groups[t.taskName].assignees.push(t);
          if (groups[t.taskName].progress < groups[t.taskName].target) groups[t.taskName].status = 'On Progress';
        });
        return Object.values(groups);
      }, [tasks]);

      // Tampilan Error Fatal
      if (globalError) {
        return (
          <div className="min-h-screen flex flex-col gap-4 items-center justify-center bg-slate-50 p-6 text-center">
            <i className="fa-solid fa-triangle-exclamation text-red-500 text-6xl drop-shadow-md"></i>
            <h2 className="text-2xl font-black text-midnight">Koneksi Ditolak</h2>
            <p className="text-red-600 font-bold bg-red-50 border border-red-200 p-4 rounded-xl shadow-sm text-sm">{globalError}</p>
            <button onClick={() => window.location.reload()} className="bg-midnight text-white px-6 py-3 rounded-full font-bold shadow-md mt-4">Muat Ulang</button>
          </div>
        );
      }

      if (isLoading) return <div className="min-h-screen flex flex-col gap-4 items-center justify-center bg-slate-50"><i className="fa-solid fa-circle-notch fa-spin text-status-selesai text-5xl drop-shadow-sm"></i><h5 className="font-black text-midnight text-sm uppercase tracking-widest">Menghubungkan...</h5></div>;

      return (
        <div className="app-container">
          <header className="bg-gradient-to-r from-midnight to-midnight-light text-white shadow-nav sticky top-0 z-50">
            <div className="px-5 py-4 flex flex-row items-center justify-between">
              <a className="text-decoration-none font-black text-white flex items-center text-xl tracking-tight" href="#">
                <div className="bg-white/10 border border-white/20 text-white rounded-xl p-1 mr-3 flex items-center justify-center shadow-inner backdrop-blur-sm" style={{width: '38px', height: '38px'}}>
                  <i className="fa-solid fa-bolt text-yellow-400 text-lg"></i>
                </div>
                MonitorPro
              </a>
              {user && <span className="bg-white/10 border border-white/20 text-white rounded-full px-3 py-1.5 shadow-sm text-[10px] font-bold uppercase tracking-wider backdrop-blur-sm"><i className="fa-solid fa-cloud-arrow-up fa-fade mr-1.5 text-status-selesai"></i> Sync</span>}
            </div>
          </header>

          <main className="p-5">
            {activeTab === 'dashboard' && <Dashboard groupedTasks={groupedTasks} setActiveTab={setActiveTab} setSelectedTaskName={setSelectedTaskName} />}
            {activeTab === 'kegiatan' && <DaftarKegiatan groupedTasks={groupedTasks} selectedTaskName={selectedTaskName} setSelectedTaskName={setSelectedTaskName} />}
            {activeTab === 'peringkat' && <Leaderboard tasks={tasks} employees={employees} />}
            {activeTab === 'input' && <ProgressForm tasks={tasks} employees={employees} user={user} db={db} />}
            {activeTab === 'admin' && <AdminPanel db={db} tasks={tasks} groupedTasks={groupedTasks} user={user} isAdminLogged={isAdminLogged} setIsAdminLogged={setIsAdminLogged} />}
          </main>

          <nav className="fixed bottom-0 w-full max-w-[600px] left-1/2 -translate-x-1/2 bg-white rounded-t-[30px] shadow-[0_-10px_40px_rgba(11,19,43,0.08)] z-50 flex justify-around items-center px-2 py-3 border-t border-slate-100">
            {[
              { id: 'dashboard', icon: 'fa-house', label: 'Beranda' },
              { id: 'kegiatan', icon: 'fa-list-check', label: 'Kegiatan' },
              { id: 'peringkat', icon: 'fa-ranking-star', label: 'Peringkat' },
              { id: 'input', icon: 'fa-pen-to-square', label: 'Lapor' },
              { id: 'admin', icon: 'fa-shield', label: 'Admin' }
            ].map(item => (
              <button key={item.id} onClick={() => { setActiveTab(item.id); setSelectedTaskName(null); }} 
                className={`flex flex-col items-center justify-center w-16 gap-1.5 transition-all duration-300 outline-none ${activeTab === item.id ? 'text-midnight scale-110' : 'text-slate-400 hover:text-slate-600'}`}>
                <i className={`fa-solid ${item.icon} text-xl transition-transform ${activeTab === item.id ? 'drop-shadow-md' : ''}`}></i>
                <span className="text-[9px] font-black uppercase tracking-wider">{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const initApp = () => {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    };
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
