<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MonitorPro - Aplikasi Monitoring</title>
  
  <script>
    window.onerror = function(msg, url, lineNo) {
      if (msg.indexOf('Script error') > -1 && lineNo === 0) {
        console.warn("Abaikan: Error dari ekstensi browser atau CDN pihak ketiga.");
        return true; 
      }
      console.error("Error System:", msg, "di baris", lineNo);
      return false;
    };
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input, select, button { touch-action: manipulation; }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-900">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect, memo } = React;

    // =========================================================================
    // ⚠️ MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI:
    // =========================================================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxJCZoevRfQhF37EI5nJEIHU4N6dwvPZqXrg8MZ521GCJdO316NbcHRN_AqX_ktIktB/exec"; 
    // =========================================================================


    // --- KOMPONEN: LIVE COUNTDOWN REAL-TIME ---
    const LiveCountdown = memo(({ deadline }) => {
      const [timeLeft, setTimeLeft] = useState('');
      const [isExpired, setIsExpired] = useState(false);

      useEffect(() => {
        // Set target ke jam 23:59:59 pada hari deadline tersebut
        const targetDate = new Date(`${deadline}T23:59:59`).getTime();

        const updateTimer = () => {
          const now = new Date().getTime();
          const distance = targetDate - now;

          if (distance < 0) {
            setTimeLeft("Waktu Habis!");
            setIsExpired(true);
            return;
          }

          const days = Math.floor(distance / (1000 * 60 * 60 * 24));
          const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          let timeString = '';
          if (days > 0) timeString += `${days}h `;
          
          // Format 00:00:00
          const h = hours < 10 ? `0${hours}` : hours;
          const m = minutes < 10 ? `0${minutes}` : minutes;
          const s = seconds < 10 ? `0${seconds}` : seconds;
          
          timeString += `${h}:${m}:${s}`;
          
          setTimeLeft(timeString);
          setIsExpired(days <= 2); // Merah jika sisa <= 2 hari
        };

        updateTimer(); // Initial call
        const interval = setInterval(updateTimer, 1000); // Update setiap 1 detik

        return () => clearInterval(interval); // Bersihkan memori saat komponen ditutup
      }, [deadline]);

      return (
        <span className={`px-2 py-1 rounded-lg text-[10px] md:text-xs font-bold whitespace-nowrap border tracking-wider flex items-center gap-1 shadow-sm ${isExpired ? 'bg-red-50 text-red-600 border-red-200' : 'bg-blue-50 text-blue-600 border-blue-200'}`}>
          <i className={`fa-solid ${isExpired ? 'fa-triangle-exclamation' : 'fa-stopwatch'} ${isExpired ? 'animate-pulse' : ''}`}></i> 
          {timeLeft}
        </span>
      );
    });

    // --- KOMPONEN: CARD TUGAS ---
    const TaskCard = memo(({ task, picName }) => {
      const percent = Math.min(Math.round((task.progress / task.target) * 100), 100);
      
      return (
        <div className="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-100 relative overflow-hidden">
          <div className={`absolute top-0 left-0 w-1.5 h-full ${percent > 80 ? 'bg-emerald-500' : percent > 40 ? 'bg-blue-500' : 'bg-orange-500'}`}></div>
          
          <div className="flex justify-between items-start mb-4 pl-3 gap-2">
            <h3 className="text-lg md:text-xl font-bold text-slate-800 leading-tight">{task.taskName}</h3>
            {/* Live Countdown Dipasang Disini */}
            <LiveCountdown deadline={task.deadline} />
          </div>

          <div className="flex items-center gap-2 mb-6 text-slate-600 text-xs md:text-sm pl-3 bg-slate-50 w-max px-3 py-1.5 rounded-lg border border-slate-100">
            <i className="fa-solid fa-user-gear text-slate-400"></i>
            <span>PIC: <span className="font-bold text-slate-700">{picName}</span></span>
          </div>
          
          <div className="mb-4 pl-3">
            <div className="flex justify-between text-xs md:text-sm mb-2 font-medium">
              <span className="text-slate-500">Target: {task.target}</span>
              <span className={`font-black text-base md:text-lg ${percent > 80 ? 'text-emerald-600' : percent > 40 ? 'text-blue-600' : 'text-orange-600'}`}>{percent}%</span>
            </div>
            <div className="w-full bg-slate-200 rounded-full h-2 md:h-3 overflow-hidden shadow-inner">
              <div className={`h-full rounded-full ${percent > 80 ? 'bg-emerald-500' : percent > 40 ? 'bg-blue-500' : 'bg-orange-500'}`} style={{ width: `${percent}%` }}></div>
            </div>
          </div>
          
          <div className="text-xs md:text-sm mt-5 pt-4 border-t border-slate-100 flex justify-between pl-3">
            <div className="bg-emerald-50 px-3 py-1.5 rounded-lg text-emerald-700 border border-emerald-100">Selesai: <b className="text-emerald-900">{task.progress}</b></div>
            <div className="bg-orange-50 px-3 py-1.5 rounded-lg text-orange-700 border border-orange-100">Sisa: <b className="text-orange-900">{task.target - task.progress}</b></div>
          </div>
        </div>
      );
    });

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [employees, setEmployees] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isSyncing, setIsSyncing] = useState(false);

      const fetchData = async () => {
        if(GAS_API_URL === "URL_GAS_ANDA_DISINI") {
          setIsLoading(false); 
          return;
        }
        setIsLoading(true);
        try {
          const response = await fetch(GAS_API_URL);
          const data = await response.json();
          
          if(data && data.pegawai && data.kegiatan) {
            setEmployees(data.pegawai.map(p => ({ id: p.id, name: p.nama })));
            setTasks(data.kegiatan.map(t => ({
              id: t.id, taskName: t.taskName, picId: t.picId, target: t.target,
              progress: t.progress || 0, deadline: t.deadline ? t.deadline.split('T')[0] : '2026-12-31', status: t.status
            })));
          }
        } catch (error) {
          console.error("Fetch Data Gagal:", error);
        }
        setIsLoading(false);
      };

      useEffect(() => { fetchData(); }, []);

      const DemoWarning = () => GAS_API_URL === "URL_GAS_ANDA_DISINI" ? (
        <div className="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-lg">
          <p className="text-red-700 text-sm font-bold"><i className="fa-solid fa-triangle-exclamation mr-1"></i> MODE OFFLINE</p>
          <p className="text-red-600 text-xs mt-1">Anda belum memasukkan URL API Google Apps Script. Fitur simpan data ke database tidak akan berfungsi.</p>
        </div>
      ) : null;

      // --- KOMPONEN: DASHBOARD ---
      const Dashboard = () => {
        const [filterEmp, setFilterEmp] = useState('all');
        const [sortOrder, setSortOrder] = useState('highest');

        const displayTasks = useMemo(() => {
          let filtered = tasks.filter(t => t.status === 'On Progress');
          if (filterEmp !== 'all') filtered = filtered.filter(t => t.picId === parseInt(filterEmp));
          return filtered.sort((a, b) => {
            const progA = (a.progress / a.target) * 100;
            const progB = (b.progress / b.target) * 100;
            return sortOrder === 'highest' ? progB - progA : progA - progB;
          });
        }, [tasks, filterEmp, sortOrder]);

        const totalTasks = tasks.length;
        const completedTasks = tasks.filter(t => t.status === 'Selesai').length;
        
        return (
          <div className="space-y-6 animate-fade-in">
            <DemoWarning />
            <div className="flex justify-between items-center">
              <h2 className="text-xl md:text-2xl font-extrabold text-slate-800">Dashboard</h2>
              <button onClick={fetchData} className="flex items-center gap-2 text-xs md:text-sm bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg hover:bg-blue-100 font-bold border border-blue-200">
                 <i className={`fa-solid fa-rotate ${isLoading ? "fa-spin" : ""}`}></i> Refresh
              </button>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div className="p-3 bg-blue-500 text-white rounded-lg flex items-center justify-center w-12 h-12"><i className="fa-solid fa-chart-pie text-xl"></i></div>
                <div><p className="text-[10px] font-bold text-slate-500 uppercase">Total Kegiatan</p><p className="text-2xl font-black text-slate-800">{totalTasks}</p></div>
              </div>
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div className="p-3 bg-emerald-500 text-white rounded-lg flex items-center justify-center w-12 h-12"><i className="fa-solid fa-circle-check text-xl"></i></div>
                <div><p className="text-[10px] font-bold text-slate-500 uppercase">Telah Selesai</p><p className="text-2xl font-black text-slate-800">{completedTasks}</p></div>
              </div>
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                <div className="p-3 bg-orange-500 text-white rounded-lg flex items-center justify-center w-12 h-12"><i className="fa-solid fa-spinner text-xl"></i></div>
                <div><p className="text-[10px] font-bold text-slate-500 uppercase">Sedang Berjalan</p><p className="text-2xl font-black text-slate-800">{totalTasks - completedTasks}</p></div>
              </div>
            </div>

            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4">
              <div className="flex items-center gap-3 w-full">
                <i className="fa-solid fa-filter text-slate-400"></i>
                <select className="bg-slate-50 border border-slate-200 rounded-lg p-2.5 w-full text-xs font-medium outline-none focus:ring-2 focus:ring-blue-500" value={filterEmp} onChange={(e) => setFilterEmp(e.target.value)}>
                  <option value="all">Semua Pegawai</option>
                  {employees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
                </select>
              </div>
              <div className="flex items-center gap-3 w-full">
                <i className="fa-solid fa-arrow-trend-up text-slate-400"></i>
                <select className="bg-slate-50 border border-slate-200 rounded-lg p-2.5 w-full text-xs font-medium outline-none focus:ring-2 focus:ring-blue-500" value={sortOrder} onChange={(e) => setSortOrder(e.target.value)}>
                  <option value="highest">Progres Terbesar (%)</option>
                  <option value="lowest">Progres Terkecil (%)</option>
                </select>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
              {displayTasks.length === 0 ? (
                <div className="col-span-full text-center py-10 bg-white rounded-2xl border border-dashed border-slate-300">
                  <p className="text-slate-500 text-sm font-medium">Tidak ada kegiatan yang berjalan saat ini.</p>
                </div>
              ) : (
                displayTasks.map(task => <TaskCard key={task.id} task={task} picName={employees.find(e => e.id === task.picId)?.name || 'Anonim'} />)
              )}
            </div>
          </div>
        );
      };

      // --- KOMPONEN: LEADERBOARD ---
      const Leaderboard = () => {
        const stats = useMemo(() => {
          return employees.map(emp => {
            const empTasks = tasks.filter(t => t.picId === emp.id);
            const totalTarget = empTasks.reduce((sum, t) => sum + t.target, 0);
            const totalProgress = empTasks.reduce((sum, t) => sum + t.progress, 0);
            const percent = totalTarget === 0 ? 0 : Math.min(Math.round((totalProgress / totalTarget) * 100), 100);
            return { ...emp, totalTarget, totalProgress, percent, taskCount: empTasks.length };
          }).sort((a, b) => b.percent - a.percent);
        }, [tasks, employees]);

        return (
          <div className="space-y-6 animate-fade-in">
            <h2 className="text-xl md:text-2xl font-extrabold text-slate-800"><i className="fa-solid fa-trophy text-yellow-500 mr-2"></i>Peringkat Kinerja</h2>
            <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-x-auto">
              <table className="min-w-full divide-y divide-slate-200">
                <thead className="bg-slate-50">
                  <tr>
                    <th className="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Rank</th>
                    <th className="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Nama</th>
                    <th className="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Tugas</th>
                    <th className="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Capaian</th>
                    <th className="px-4 py-3 text-left text-xs font-bold text-slate-500 uppercase">Kinerja</th>
                  </tr>
                </thead>
                <tbody className="bg-white divide-y divide-slate-100">
                  {stats.map((stat, index) => (
                    <tr key={stat.id}>
                      <td className="px-4 py-3 whitespace-nowrap font-bold text-sm">
                        {index === 0 ? <span className="bg-yellow-100 text-yellow-700 px-2 py-1 rounded shadow-sm"><i className="fa-solid fa-medal"></i> 1</span> : index + 1}
                      </td>
                      <td className="px-4 py-3 whitespace-nowrap font-bold text-sm text-slate-800">{stat.name}</td>
                      <td className="px-4 py-3 whitespace-nowrap text-xs font-medium text-slate-500">{stat.taskCount}</td>
                      <td className="px-4 py-3 whitespace-nowrap text-xs font-medium text-slate-600">{stat.totalProgress} / {stat.totalTarget}</td>
                      <td className="px-4 py-3 whitespace-nowrap">
                        <div className="flex items-center gap-2 min-w-[100px]">
                          <div className="w-full bg-slate-200 rounded-full h-2 shadow-inner"><div className={`h-full rounded-full ${stat.percent >= 80 ? 'bg-emerald-500' : 'bg-blue-500'}`} style={{ width: `${stat.percent}%` }}></div></div>
                          <span className="font-bold text-xs">{stat.percent}%</span>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      };

      // --- KOMPONEN: INPUT PROGRES ---
      const ProgressForm = () => {
        const [selectedEmp, setSelectedEmp] = useState('');
        const [selectedTask, setSelectedTask] = useState('');
        const [amount, setAmount] = useState('');
        const [message, setMessage] = useState('');

        const availableTasks = tasks.filter(t => t.picId === parseInt(selectedEmp) && t.status === 'On Progress');

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (GAS_API_URL === "URL_GAS_ANDA_DISINI") { alert("Link API masih kosong."); return; }
          
          setIsSyncing(true);
          try {
            const payload = { action: 'UPDATE_PROGRESS', payload: { id: parseInt(selectedTask), amount: parseInt(amount) } };
            await fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });

            const updatedTasks = [...tasks];
            const taskIndex = updatedTasks.findIndex(t => t.id === parseInt(selectedTask));
            const task = updatedTasks[taskIndex];
            const newProgress = task.progress + parseInt(amount);
            const isDone = newProgress >= task.target;

            updatedTasks[taskIndex] = { ...task, progress: isDone ? task.target : newProgress, status: isDone ? 'Selesai' : 'On Progress' };
            setTasks(updatedTasks);
            setAmount('');
            setMessage(`Capaian tersimpan. ${isDone ? '🎉 Kegiatan Selesai!' : ''}`);
            setTimeout(() => setMessage(''), 4000);
          } catch (err) {
            alert("Gagal menyimpan, cek koneksi internet.");
          }
          setIsSyncing(false);
        };

        return (
          <div className="max-w-md mx-auto space-y-4 animate-fade-in">
            <h2 className="text-xl font-extrabold text-slate-800 text-center">Lapor Progres Harian</h2>
            {message && <div className="bg-emerald-50 text-emerald-800 p-3 rounded-lg text-xs font-bold border border-emerald-200"><i className="fa-solid fa-circle-check mr-1"></i> {message}</div>}
            
            <form onSubmit={handleSubmit} className="bg-white p-5 rounded-xl shadow-sm border border-slate-100 space-y-4">
              <select required className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500" value={selectedEmp} onChange={(e) => { setSelectedEmp(e.target.value); setSelectedTask(''); }}>
                <option value="">Pilih Nama Anda...</option>
                {employees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
              </select>
              {selectedEmp && (
                <select required className="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-medium outline-none focus:ring-2 focus:ring-blue-500" value={selectedTask} onChange={(e) => setSelectedTask(e.target.value)}>
                  <option value="">Tugas yang dikerjakan...</option>
                  {availableTasks.map(t => <option key={t.id} value={t.id}>{t.taskName} (Sisa: {t.target - t.progress})</option>)}
                </select>
              )}
              {selectedTask && (
                <input type="number" required min="1" className="w-full bg-white border border-slate-200 rounded-lg p-3 font-bold text-slate-800 text-sm outline-none focus:ring-2 focus:ring-blue-500" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="Jumlah capaian hari ini..." />
              )}
              <button type="submit" disabled={!selectedTask || isSyncing} className="w-full bg-blue-600 text-white font-bold text-sm py-3 rounded-lg flex justify-center items-center gap-2 disabled:bg-slate-300">
                {isSyncing ? <i className="fa-solid fa-spinner fa-spin"></i> : <><i className="fa-solid fa-paper-plane"></i> Kirim Laporan</>}
              </button>
            </form>
          </div>
        );
      };

      // --- KOMPONEN: ADMIN PANEL ---
      const AdminPanel = () => {
        const [newTask, setNewTask] = useState({ taskName: '', picId: '', target: '', deadline: '', multiTargets: {} });
        const [successMsg, setSuccessMsg] = useState('');
        const [errorMsg, setErrorMsg] = useState('');
        const fileInputRef = useRef(null);

        const handleAddTask = async (e) => {
          e.preventDefault();
          if (GAS_API_URL === "URL_GAS_ANDA_DISINI") { alert("Link API masih kosong."); return; }
          
          setIsSyncing(true);
          try {
            let addedTasks = [];
            if (newTask.picId === 'all') {
              employees.forEach((emp, idx) => {
                const empTarget = parseInt(newTask.multiTargets[emp.id]);
                if (empTarget > 0) addedTasks.push({ id: Date.now() + idx, taskName: newTask.taskName, picId: emp.id, target: empTarget, progress: 0, deadline: newTask.deadline, status: 'On Progress' });
              });
              await fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'IMPORT_TASKS', payload: addedTasks }) });
            } else {
              const task = { id: Date.now(), taskName: newTask.taskName, picId: parseInt(newTask.picId), target: parseInt(newTask.target), progress: 0, deadline: newTask.deadline, status: 'On Progress' };
              addedTasks.push(task);
              await fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'ADD_TASK', payload: task }) });
            }

            setTasks([...tasks, ...addedTasks]);
            setNewTask({ taskName: '', picId: '', target: '', deadline: '', multiTargets: {} });
            setSuccessMsg('Penugasan berhasil ditambahkan!'); setTimeout(() => setSuccessMsg(''), 4000);
          } catch (err) {
            setErrorMsg("Gagal menyimpan tugas ke database."); setTimeout(() => setErrorMsg(''), 4000);
          }
          setIsSyncing(false);
        };

        // --- FITUR DOWNLOAD TEMPLATE EXCEL ---
        const handleDownloadTemplate = () => {
          try {
            const templateData = [
              ["Nama Kegiatan", "ID PIC", "Target", "Deadline"],
              ["Contoh Tugas A", 1, 100, "2026-12-31"],
              ["Contoh Tugas B", 2, 50, "2026-11-30"]
            ];
            const worksheet = XLSX.utils.aoa_to_sheet(templateData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Template_Import");
            
            XLSX.writeFile(workbook, "Template_Import_MonitorPro.xlsx");
          } catch (err) {
            alert("Gagal mendownload template.");
          }
        };

        // --- MESIN IMPORT EXCEL & CSV ---
        const handleExcelUpload = (e) => {
          const file = e.target.files[0];
          if (!file) return;

          const reader = new FileReader();
          reader.onload = async (event) => {
            try {
              const data = new Uint8Array(event.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const excelData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: "" });

              const newTasks = [];
              for(let i = 0; i < excelData.length; i++) {
                const row = excelData[i];
                
                const taskName = row['Nama Kegiatan'] || row['nama kegiatan'] || row['Kegiatan'] || row['Task Name'];
                const picId = parseInt(row['ID PIC'] || row['id pic'] || row['PIC'] || row['ID']);
                const target = parseInt(row['Target'] || row['target']);
                
                if (!taskName || isNaN(picId) || isNaN(target)) continue;

                let finalDeadline = new Date().toISOString().split('T')[0];
                const rawDeadline = row['Deadline'] || row['deadline'] || row['Tanggal'];
                
                if (rawDeadline) {
                  if (typeof rawDeadline === 'number') {
                    const dateObj = new Date((rawDeadline - (25567 + 2)) * 86400 * 1000);
                    finalDeadline = dateObj.toISOString().split('T')[0];
                  } else {
                    finalDeadline = rawDeadline;
                  }
                }

                newTasks.push({ 
                  id: Date.now() + Math.floor(Math.random() * 1000) + i, 
                  taskName: taskName, 
                  picId: picId, 
                  target: target, 
                  progress: 0, 
                  deadline: finalDeadline, 
                  status: 'On Progress' 
                });
              }

              if (newTasks.length > 0) {
                setIsSyncing(true);
                await fetch(GAS_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'IMPORT_TASKS', payload: newTasks }) });
                
                setTasks(prev => [...prev, ...newTasks]);
                setSuccessMsg(`Berhasil! ${newTasks.length} data tugas ditambahkan.`); 
                setTimeout(() => setSuccessMsg(''), 5000);
              } else {
                throw new Error("Data Kosong / Format Salah. Silakan Download Template!");
              }
            } catch (error) { 
              setErrorMsg(error.message || "Gagal membaca file CSV/Excel."); 
              setTimeout(() => setErrorMsg(''), 6000);
            } finally {
              setIsSyncing(false);
              e.target.value = null;
            }
          };
          reader.readAsArrayBuffer(file);
        };

        return (
          <div className="space-y-6 animate-fade-in pb-10">
            <h2 className="text-xl md:text-2xl font-extrabold text-slate-800"><i className="fa-solid fa-users-gear text-indigo-600 mr-2"></i>Panel Admin</h2>
            
            {successMsg && <div className="bg-emerald-50 text-emerald-800 p-3 rounded-lg text-xs font-bold border border-emerald-200"><i className="fa-solid fa-circle-check mr-1"></i> {successMsg}</div>}
            {errorMsg && <div className="bg-red-50 text-red-800 p-3 rounded-lg text-xs font-bold border border-red-200"><i className="fa-solid fa-triangle-exclamation mr-1"></i> {errorMsg}</div>}
            
            {/* FITUR DOWNLOAD TEMPLATE */}
            <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-5 rounded-xl text-white shadow-sm flex items-center justify-between">
              <div>
                <h3 className="font-bold text-sm mb-1"><i className="fa-solid fa-file-arrow-down mr-1"></i> Template Import Excel</h3>
                <p className="text-[10px] text-blue-100">Gunakan file ini agar format upload berhasil.</p>
              </div>
              <button onClick={handleDownloadTemplate} className="bg-white text-indigo-700 font-bold text-xs py-2 px-3 rounded-lg shadow hover:bg-blue-50 transition">
                Download
              </button>
            </div>

            <div className="bg-emerald-700 p-5 rounded-xl text-white shadow-sm relative overflow-hidden">
              <i className="fa-solid fa-file-excel absolute -right-4 -bottom-4 text-6xl text-emerald-800 opacity-50"></i>
              <div className="relative z-10">
                <h3 className="font-bold text-sm mb-2"><i className="fa-solid fa-cloud-arrow-up mr-1"></i> Upload Data Massal</h3>
                <p className="text-[10px] text-emerald-200 mb-4">Pilih file hasil isian dari template (.xlsx atau .csv).</p>
                <input type="file" accept=".xlsx, .xls, .csv" ref={fileInputRef} onChange={handleExcelUpload} className="hidden" />
                <button onClick={() => fileInputRef.current.click()} disabled={isSyncing} className="bg-white text-emerald-800 font-bold text-xs py-2.5 px-4 rounded-lg w-full flex justify-center items-center gap-2">
                   {isSyncing ? <><i className="fa-solid fa-spinner fa-spin text-emerald-600"></i> Memproses Data...</> : <><i className="fa-solid fa-folder-open"></i> Pilih File Excel</>}
                </button>
              </div>
            </div>

            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-100">
              <h3 className="font-bold text-sm mb-3">Tugas Manual Baru</h3>
              <form onSubmit={handleAddTask} className="space-y-3">
                <input required type="text" className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500" value={newTask.taskName} onChange={e => setNewTask({...newTask, taskName: e.target.value})} placeholder="Nama Kegiatan..." />
                <select required className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500" value={newTask.picId} onChange={e => setNewTask({...newTask, picId: e.target.value})}>
                  <option value="">Pilih Pegawai...</option>
                  <option value="all">🚀 Semua Pegawai</option>
                  {employees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
                </select>
                
                {newTask.picId === 'all' ? (
                  <div className="bg-indigo-50 p-3 rounded-lg space-y-2">
                    {employees.map(emp => (
                      <div key={emp.id} className="flex justify-between items-center text-xs">
                        <span className="font-bold text-slate-700">{emp.name}</span>
                        <input type="number" min="0" placeholder="Target" className="border rounded p-1.5 w-16 outline-none focus:border-indigo-500" value={newTask.multiTargets[emp.id] || ''} onChange={e => setNewTask({...newTask, multiTargets: {...newTask.multiTargets, [emp.id]: e.target.value}})} />
                      </div>
                    ))}
                    <input required type="date" className="w-full mt-2 rounded p-2 text-xs border border-slate-200" value={newTask.deadline} onChange={e => setNewTask({...newTask, deadline: e.target.value})} />
                  </div>
                ) : (
                  <div className="flex gap-2">
                    <input required type="number" min="1" placeholder="Target" className="w-1/2 bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-indigo-500" value={newTask.target} onChange={e => setNewTask({...newTask, target: e.target.value})} />
                    <input required type="date" className="w-1/2 bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs outline-none focus:ring-2 focus:ring-indigo-500" value={newTask.deadline} onChange={e => setNewTask({...newTask, deadline: e.target.value})} />
                  </div>
                )}
                <button type="submit" disabled={isSyncing} className="w-full bg-indigo-600 text-white font-bold text-xs py-3 rounded-lg flex justify-center items-center gap-2">
                  {isSyncing ? <i className="fa-solid fa-spinner fa-spin"></i> : <><i className="fa-solid fa-plus"></i> Tugaskan</>}
                </button>
              </form>
            </div>
          </div>
        );
      };

      if (isLoading) return <div className="min-h-screen flex items-center justify-center bg-slate-50"><i className="fa-solid fa-circle-notch fa-spin text-3xl text-blue-600"></i></div>;

      // --- MAIN LAYOUT ---
      return (
        <div className="min-h-screen flex flex-col max-w-lg mx-auto bg-slate-50 md:border-x md:border-slate-200 shadow-xl">
          <header className="bg-white shadow-sm sticky top-0 z-50">
            <div className="px-4 h-14 flex items-center gap-2">
              <div className="bg-blue-600 p-1.5 rounded-md text-white"><i className="fa-solid fa-chart-line"></i></div>
              <h1 className="text-lg font-black text-slate-800">Monitor<span className="text-blue-600">Pro</span></h1>
            </div>
          </header>

          <main className="flex-grow w-full px-4 py-6 overflow-y-auto pb-24">
            {activeTab === 'dashboard' && <Dashboard />}
            {activeTab === 'peringkat' && <Leaderboard />}
            {activeTab === 'input' && <ProgressForm />}
            {activeTab === 'admin' && <AdminPanel />}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-2 py-1.5 flex justify-around max-w-lg mx-auto pb-safe z-50 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
            {[
              { id: 'dashboard', icon: 'fa-house', label: 'Home' },
              { id: 'peringkat', icon: 'fa-ranking-star', label: 'Rank' },
              { id: 'input', icon: 'fa-pen-to-square', label: 'Lapor' },
              { id: 'admin', icon: 'fa-user-gear', label: 'Admin' }
            ].map(item => (
              <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center p-2 rounded-xl transition-colors ${activeTab === item.id ? 'text-blue-600' : 'text-slate-400'}`}>
                <i className={`fa-solid ${item.icon} text-lg mb-1`}></i>
                <span className="text-[10px] font-bold">{item.label}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
